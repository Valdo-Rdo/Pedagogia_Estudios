  <h3 class="sub-title"><i class="fas fa-clipboard-list"></i> Acompañar el recurso con instrucciones</h3>
  <p style="color:var(--text-soft); font-size:0.95rem; line-height:1.7; margin-bottom:14px;">
    Subir el recurso sin instrucciones es el error #1 que cometen docentes principiantes. El estudiante llega, ve el link y no sabe qué hacer. Acompaña cada recurso con: 1) qué van a hacer (en 1 línea), 2) cuánto tiempo toma, 3) qué necesitan (cuenta, internet, materiales), 4) criterios de éxito (cómo sabrán que lo lograron), 5) qué hacer si se atoran (a quién/contacto). Sin este andamiaje, el mejor recurso naufraga.
  </p>
  <div class="prompt-block">
    <span class="prompt-tag">Prompt · Instrucciones para acompañar recurso</span><br>
    "Escribe el texto que acompañará al recurso <code>NOMBRE_RECURSO</code> en mi LMS <code>PLATAFORMA</code>. Incluye: 1) qué harán (1 línea), 2) tiempo estimado, 3) qué necesitan (cuenta/internet/materiales), 4) 3 criterios de éxito, 5) qué hacer si se atoran. Tono cercano, no burocrático. Máx 120 palabras."
  </div>
</section>


<section class="component-group highlight-green" id="etica">
  <h2>🛡️ Errores y Ética con IA <span class="badge">Lo que la IA no te dirá</span></h2>
  <p class="desc">
    <i class="fas fa-shield-heart"></i> La IA te acelera, pero también te expone: a errores que vas a transmitir a tus estudiantes, a sesgos que vas a normalizar, a violaciones de privacidad que pueden costarte el puesto. Esta sección es la que separa a un docente novato que usa IA de un docente profesional. Lee cada caso, y antes de usar cualquier recurso generado por IA en clase, pasa por estos 6 filtros. Si alguno falla, detente. Mejor un recurso mediocre tuyo que un recurso brillante de la IA que reproduce un sesgo que no detectaste.
  </p>

  <div class="accordion-item active">
    <div class="accordion-header"><strong>1. Alucinaciones: la IA inventa datos y autores</strong> <i class="fas fa-chevron-down"></i></div>
    <div class="accordion-body">
      <p>La IA genera con seguridad información <strong>inventada</strong>: fechas erróneas, autores que no existen, citas a papers inexistentes, estadísticas falsas. Especialmente peligroso en historia, ciencias sociales y biografías. Tu estudiante no tiene por qué saber que es falso; tú sí.</p>
      <p><strong>Síntomas:</strong> Datos con confianza estadística redonda (87.4%), citas a libros que no aparecen en Google Scholar, fechas con año-mes-día exactos.</p>
      <p><strong>Solución:</strong> Verifica <strong>cada dato</strong> contra fuente confiable antes de usarlo con estudiantes. Pídele a la IA: <code>"Verifica cada hecho, fecha y autor de esta respuesta. Marca con [VERIFICAR] los que no puedas confirmar."</code>. Si la IA no puede verificar, asume falso.</p>
    </div>
  </div>

  <div class="accordion-item">
    <div class="accordion-header"><strong>2. Sesgos: la IA reproduce estereotipos</strong> <i class="fas fa-chevron-down"></i></div>
    <div class="accordion-body">
      <p>La IA entrenó en internet, que es sexista, racista, capacitista y clasista. Genera ejemplos donde los médicos son hombres y las enfermeras mujeres; donde "familia" significa mamá-papá-hijos; donde discapacidad se omite. No es malicioso, es estadístico. Pero reproduce el problema.</p>
      <p><strong>Síntomas:</strong> Ejemplos con nombres de un solo género/raza/clase. Situaciones que asumen condiciones de vida urbanas-medias. Ausencia de personas con discapacidad como protagonistas.</p>
      <p><strong>Solución:</strong> Pídele: <code>"Revisa este recurso por sesgos: género, etnia, clase, discapacidad, orientación sexual. Propón ajustes para hacerlo inclusivo."</code>. Diversifica nombres, situaciones y protagonistas. Aplica perspectiva interseccional.</p>
    </div>
  </div>

  <div class="accordion-item">
    <div class="accordion-header"><strong>3. Privacidad de datos de estudiantes</strong> <i class="fas fa-chevron-down"></i></div>
    <div class="accordion-body">
      <p>Si pegas trabajos de tus estudiantes en ChatGPT, estás subiendo sus datos (nombre, escritos, posibles detalles personales) a un servidor de EEUU. Esto puede violar LOPD, LGPDPP, FERPA, o las políticas de tu institución. Aunque anonimices, el contenido puede identificar al estudiante (escritura, tema específico).</p>
      <p><strong>Síntomas:</strong> Subir borradores completos con nombre del estudiante. Pedir feedback a IA sobre texto que revela info médica/familiar. Permitir que estudiantes menores usen IA sin consentimiento informado de padres.</p>
      <p><strong>Solución:</strong> Anonimiza <strong>antes</strong> de pegar. Verifica política institucional. Considera opciones locales (LM Studio con modelo local) para datos sensibles. Nunca subas actas, IEP, datos personales identificables.</p>
    </div>
  </div>

  <div class="accordion-item">
    <div class="accordion-header"><strong>4. Plagio y autoría: ¿quién escribió esto?</strong> <i class="fas fa-chevron-down"></i></div>
    <div class="accordion-body">
      <p>Si publicas un recurso generado por IA como si fuera tuyo, ¿es plagio? Depende: si lo refinaste y lo adaptaste, es autoría asistida. Si lo pegaste crudo, es delegación. Con tus estudiantes, el dilema es más claro: ¿están autorizados a usar IA? ¿Cómo citan? Sin política clara, hay problemas.</p>
      <p><strong>Síntomas:</strong> Recursos sin mención de IA en créditos. Estudiantes que entregan trabajos con estilo claramente de IA sin citarla. Discusiones de "¿esto es tuyo?" sin criterio.</p>
      <p><strong>Solución:</strong> Declara en tu recurso: "Generado con asistencia de IA (ChatGPT/Claude), revisado y adaptado por [tu nombre]". Define con tus estudiantes una política clara: cuándo pueden usar IA, cómo citarla, qué partes deben ser propias. Conversa, no prohíbas sin entender.</p>
    </div>
  </div>

  <div class="accordion-item">
    <div class="accordion-header"><strong>5. Dependencia cognitiva: ¿aprenden o solo copian?</strong> <i class="fas fa-chevron-down"></i></div>
    <div class="accordion-body">
      <p>Si tus estudiantes usan IA para escribir sus trabajos, ¿aprenden algo? La respuesta es matizada: la IA puede andamiar (dar retroalimentación, generar variantes para comparar) o sustituir (escribir por ellos). Sin diseño pedagógico deliberado, la IA sustituye.</p>
      <p><strong>Síntomas:</strong> Trabajos con calidad muy superior a la del estudiante en clase. Sin proceso visible (borradores, edición). Diferencia enorme entre lo que el estudiante "sabe" y lo que "produce".</p>
      <p><strong>Solución:</strong> Diseña tareas que valoren el <strong>proceso</strong> además del producto. Pide borradores, versiones intermedias, reflexiones metacognitivas. Usa IA para andamiar, no para sustituir: "La IA da feedback, tú decides qué cambiar". Enseña a usar IA como herramienta de pensamiento, no como atajo.</p>
    </div>
  </div>

  <div class="accordion-item">
    <div class="accordion-header"><strong>6. Brecha digital: ¿excluyes a quien no tiene internet?</strong> <i class="fas fa-chevron-down"></i></div>
    <div class="accordion-body">
      <p>Tus recursos digitales asumen dispositivo, internet y habilidades digitales. En escuelas públicas de LATAM, no todos tienen eso. Si tu recurso "es bonito pero no funciona para el 30% del grupo", no es accesible. DUA también aplica a la brecha digital.</p>
      <p><strong>Síntomas:</strong> Estudiantes que no entregan porque "no pudieron entrar". Familias que reportan no tener internet. Trabajos entregados en papel cuando pediste digital.</p>
      <p><strong>Solución:</strong> Ofrece versión imprimible de cada recurso digital. Coordina con la escuela acceso a computadoras/salón de cómputo. Plan B asincrónico para estudiantes sin internet en casa. No asumas dispositivo personal. La brecha no es excusa del estudiante, es restricción del diseño.</p>
    </div>
  </div>
</section>


<section class="component-group" id="glosario">
  <h2>📖 Glosario Pedagógico-Tecnológico <span class="badge">40+ términos</span></h2>
  <p class="desc">
    <i class="fas fa-book"></i> Estos son los términos que vas a encontrar cuando leas sobre vibecoding pedagógico, cuando hables con colegas tech o cuando escribas prompts. Cuanto más uses este vocabulario, más precisa será tu comunicación. Si dudas entre dos términos (por ejemplo <code>formativa</code> vs <code>sumativa</code>), basta con mencionarlos para que la IA te explique la diferencia y te recomiende cuál aplicar.
  </p>
  <div class="glossary-grid">
    <div class="glossary-item"><strong>TPACK</strong><span>Mishra &amp; Koehler, 2006. Intersección de 3 saberes: contenido, pedagogía y tecnología.</span></div>
    <div class="glossary-item"><strong>SAMR</strong><span>Puentedura, 2006. 4 niveles de integración tecnológica: Sustitución, Aumento, Modificación, Redefinición.</span></div>
    <div class="glossary-item"><strong>Bloom (revisada)</strong><span>Anderson &amp; Krathwohl, 2001. 6 niveles cognitivos: Recordar, Comprender, Aplicar, Analizar, Evaluar, Crear.</span></div>
    <div class="glossary-item"><strong>DUA</strong><span>Diseño Universal de Aprendizaje (CAST). 3 principios: representación, acción/expresión, implicación.</span></div>
    <div class="glossary-item"><strong>Andamiaje</strong><span>Apoyo temporal que permite al estudiante hacer lo que aún no puede hacer solo (Vigotsky, ZPD).</span></div>
    <div class="glossary-item"><strong>ZPD</strong><span>Zona de Desarrollo Próximo. Brecha entre lo que el estudiante puede hacer solo y con ayuda.</span></div>
    <div class="glossary-item"><strong>Eval. formativa</strong><span>Evaluación durante el proceso, para ajustar la enseñanza. No cuenta para la nota final.</span></div>
    <div class="glossary-item"><strong>Eval. sumativa</strong><span>Evaluación al final del proceso, para certificar aprendizaje. Sí cuenta para la nota.</span></div>
    <div class="glossary-item"><strong>Eval. diagnóstica</strong><span>Al inicio del proceso, para saber qué traen los estudiantes. No cuenta para la nota.</span></div>
    <div class="glossary-item"><strong>Retroalimentación formativa</strong><span>Feedback específico, oportuno, accionable. Mejora el trabajo, no solo lo juzga.</span></div>
    <div class="glossary-item"><strong>Constructivismo</strong><span>El estudiante construye conocimiento activamente, no lo recibe pasivo (Piaget, Vigotsky).</span></div>
    <div class="glossary-item"><strong>Conectivismo</strong><span>Teoría de aprendizaje en era digital (Siemens). Aprender es conectar nodos.</span></div>
    <div class="glossary-item"><strong>Flipped classroom</strong><span>Modelo donde el estudiante ve el contenido en casa y la clase se usa para aplicación.</span></div>
    <div class="glossary-item"><strong>Blended learning</strong><span>Combinación intencional de presencial y virtual. No es "todo online".</span></div>
    <div class="glossary-item"><strong>PBL</strong><span>Project-Based Learning. Aprendizaje basado en proyectos, Weeks de duración.</span></div>
    <div class="glossary-item"><strong>ABP</strong><span>Aprendizaje Basado en Problemas (Problem-Based). Más corto que PBL, foco en problema.</span></div>
    <div class="glossary-item"><strong>Recurso didáctico</strong><span>Material diseñado intencionalmente para facilitar un aprendizaje específico.</span></div>
    <div class="glossary-item"><strong>Objeto de aprendizaje (OCW)</strong><span>Recurso autocontenido, reutilizable, con objetivo+contenido+actividad+evaluación.</span></div>
    <div class="glossary-item"><strong>Secuencia didáctica</strong><span>Conjunto ordenado de actividades que llevan a un objetivo de aprendizaje.</span></div>
    <div class="glossary-item"><strong>Plan de clase</strong><span>Documento que estructura una sesión: objetivo, actividades, tiempos, evaluación.</span></div>
    <div class="glossary-item"><strong>LMS</strong><span>Learning Management System. Plataforma para gestionar cursos (Moodle, Classroom, Canvas).</span></div>
    <div class="glossary-item"><strong>SCORM</strong><span>Estándar para empaquetar objetos de aprendizaje interoperables entre LMS.</span></div>
    <div class="glossary-item"><strong>LTI</strong><span>Learning Tools Interoperability. Estándar para integrar herramientas externas en LMS.</span></div>
    <div class="glossary-item"><strong>H5P</strong><span>Librería open source para crear contenido interactivo HTML5 embebible en LMS.</span></div>
    <div class="glossary-item"><strong>HTML</strong><span>HyperText Markup Language. Define estructura del contenido web.</span></div>
    <div class="glossary-item"><strong>CSS</strong><span>Cascading Style Sheets. Define estilo (colores, tamaños, disposición) del HTML.</span></div>
    <div class="glossary-item"><strong>JavaScript (JS)</strong><span>Lenguaje que añade interactividad a las páginas web.</span></div>
    <div class="glossary-item"><strong>Prompt</strong><span>Instrucción que le das a la IA. Su claridad determina la calidad de la respuesta.</span></div>
    <div class="glossary-item"><strong>Alucinación</strong><span>Cuando la IA genera información falsa con apariencia de verdad.</span></div>
    <div class="glossary-item"><strong>Few-shot</strong><span>Dar 2-3 ejemplos en el prompt para que la IA calibre el formato/tipo de respuesta.</span></div>
    <div class="glossary-item"><strong>Chain-of-thought</strong><span>Pedir a la IA "piensa paso a paso". Mejora resultados en problemas complejos.</span></div>
    <div class="glossary-item"><strong>Persona pattern</strong><span>Iniciar prompt con "Actúa como..." para que la IA adopte un rol específico.</span></div>
    <div class="glossary-item"><strong>Token</strong><span>Unidad de texto que cobra la IA (~4 caracteres). 100 tokens ≈ 75 palabras.</span></div>
    <div class="glossary-item"><strong>LLM</strong><span>Large Language Model. Modelo de IA de lenguaje (GPT-4, Claude, Gemini, Llama).</span></div>
    <div class="glossary-item"><strong>Embed</strong><span>Incrustar un recurso (video, Genially, H5P) dentro de otra página vía código HTML.</span></div>
    <div class="glossary-item"><strong>Accesibilidad</strong><span>Que personas con discapacidad puedan usar el recurso (contraste, alt, subtítulos).</span></div>
    <div class="glossary-item"><strong>WCAG</strong><span>Web Content Accessibility Guidelines. Estándar internacional de accesibilidad web.</span></div>
    <div class="glossary-item"><strong>Contraste AA</strong><span>Nivel mínimo de contraste texto-fondo recomendado para accesibilidad (4.5:1).</span></div>
    <div class="glossary-item"><strong>Diferenciación</strong><span>Ajustar contenido, proceso o producto según necesidades de cada estudiante.</span></div>
    <div class="glossary-item"><strong>NEE</strong><span>Necesidades Educativas Especiales. Requieren ajustes al currículo o recursos.</span></div>
    <div class="glossary-item"><strong>IEP</strong><span>Individualized Education Program. Plan individualizado para estudiante con NEE.</span></div>
    <div class="glossary-item"><strong>Gamificación</strong><span>Aplicar mecánicas de juego (puntos, retos, niveles) a contextos no lúdicos.</span></div>
    <div class="glossary-item"><strong>Microlearning</strong><span>Contenido en cápsulas cortas (3-7 min) para un objetivo específico.</span></div>
    <div class="glossary-item"><strong>Asincrónico</strong><span>Cada quien hace la actividad en su tiempo, no al mismo tiempo.</span></div>
    <div class="glossary-item"><strong>Sincrónico</strong><span>Todos hacen la actividad al mismo tiempo (videoconferencia, clase presencial).</span></div>
  </div>
</section>


<section class="component-group highlight-orange" id="plantillas">
  <h2>📋 Plantillas de Prompts (copia y pega) <span class="badge">30+ recetas</span></h2>
  <p class="desc">
    <i class="fas fa-file-lines"></i> Esta es tu chuleta maestra: 30+ prompts listos para usar, organizados por tipo de recurso. Reemplaza los campos en <code>[CORCHETES]</code> con tus datos. Súbelos a tu IA favorita (ChatGPT, Claude, MagicSchool) y refina. La primera respuesta es el borrador; las 3 siguientes son el recurso final. No tengas miedo de pedir "más interactivo", "más simple", "diferenciado para X". Cuanto más iteres, mejor el resultado.
  </p>

  <h3 class="sub-title"><i class="fas fa-calendar-day"></i> Planificación</h3>
  <div class="prompt-block"><span class="prompt-tag">Plan de clase</span><br>
  "Actúa como docente con [N] años en [NIVEL]. Crea un plan de [DURACIÓN] min sobre [TEMA] para [GRADO], alineado con [MARCO_CURRICULAR]. Incluye: objetivo enunciable, apertura ([X] min), desarrollo ([Y] min), cierre ([Z] min), evaluación formativa. Diferenciación DUA para [NEE]. Materiales accesibles en [CONTEXTO]."</div>

  <div class="prompt-block"><span class="prompt-tag">Secuencia didáctica (varias sesiones)</span><br>
  "Diseña una secuencia didáctica de [N] sesiones de [DURACIÓN] min cada una, sobre [TEMA] para [GRADO]. Cada sesión con: objetivo, actividades, evaluación. La secuencia debe progresar en Bloom de [NIVEL_INICIAL] a [NIVEL_FINAL]. Incluye evaluación intermedia y final. Alineado con [MARCO]."</div>

  <div class="prompt-block"><span class="prompt-tag">Plan anual/semestral</span><br>
  "Genera un plan [ANUAL/SEMESTRAL] para [MATERIA] en [GRADO]. Estructura por [BIMESTRES/TRIMESTRES/UNIDADES]. Cada unidad: aprendizaje esperado, duración, recursos sugeridos, evaluación. Total [HORAS] hrs. Algo de flexibilidad para imprevistos."</div>

  <h3 class="sub-title"><i class="fas fa-clipboard-check"></i> Evaluación</h3>
  <div class="prompt-block"><span class="prompt-tag">Rúbrica analítica</span><br>
  "Diseña rúbrica analítica de 4 niveles (Inicial, En desarrollo, Logrado, Sobresaliente) y [N] criterios para evaluar [PRODUCTO] de [NIVEL]. Criterios: [LISTA]. Pesos: [DISTRIBUCIÓN]. Descriptores observables, no juicios. Formato tabla markdown."</div>

  <div class="prompt-block"><span class="prompt-tag">Rúbrica holística</span><br>
  "Diseña rúbrica holística de 4 niveles para [PRODUCTO] de [NIVEL]. Una sola valoración global por nivel. Útil para tareas cortas. Descriptores observables en cada nivel."</div>

  <div class="prompt-block"><span class="prompt-tag">Examen con clave</span><br>
  "Genera examen de [MATERIA] para [GRADO] sobre [TEMA]: [N] opción múltiple, [N] V/F con justificación, [N] abiertos. Dificultad creciente. Incluye clave de respuestas y por qué cada opción es correcta/incorrecta."</div>

  <div class="prompt-block"><span class="prompt-tag">Convertir sumativa en formativa</span><br>
  "Tengo este examen sumativo: [PEGAR]. Convirtelo en 3 instrumentos formativos: 1) ticket de salida 5 min, 2) autoevaluación guiada, 3) retroalimentación entre pares. Mantiene objetivo pero cambia momento y función."</div>

  <div class="prompt-block"><span class="prompt-tag">Retroalimentación personalizada</span><br>
  "Trabajo de estudiante: [PEGAR]. Rúbrica: [PEGAR_RÚBRICA]. Genera retroalimentación en 3 párrafos: 1) fortalezas con ejemplos, 2) mejoras con sugerencias concretas, 3) siguiente paso. Tono cercano, no punitivo. Máx 250 palabras."</div>

  <h3 class="sub-title"><i class="fas fa-image"></i> Infografías y presentaciones</h3>
  <div class="prompt-block"><span class="prompt-tag">Infografía</span><br>
  "Genera contenido de infografía de 5 secciones sobre [TEMA] para [GRADO]: título atractivo, dato impactante, 4 subtemas con 2-3 bullets, dato final. Para Canva vertical. Indica dónde va ícono/imágen. Sin párrafos largos."</div>

  <div class="prompt-block"><span class="prompt-tag">Presentación</span><br>
  "Estructura presentación de [N] diapositivas sobre [TEMA] para [GRADO]. 1 idea por diapositiva, sin párrafos, con bullet máximo 6 palabras. Pregunta de discusión al final. Indica dónde va visual (gráfico/foto)."</div>

  <div class="prompt-block"><span class="prompt-tag">Mapa mental</span><br>
  "Genera estructura de mapa mental sobre [TEMA]: nodo central, 4 ramas principales, cada rama con 3 sub-ramas, cada sub-rama con 2 keywords. Formato jerárquico que pueda llevar a MindMeister o XMind."</div>

  <h3 class="sub-title"><i class="fas fa-puzzle-piece"></i> Actividades interactivas</h3>
  <div class="prompt-block"><span class="prompt-tag">Quiz de opción múltiple</span><br>
  "Genera [N] preguntas de opción múltiple sobre [TEMA] para [GRADO], 4 opciones, clave señalada. Nivel Bloom: [NIVEL]. Incluye 2 distractores plausibles por pregunta. Justifica por qué la correcta lo es."</div>

  <div class="prompt-block"><span class="prompt-tag">Actividad drag-and-drop (Wordwall)</span><br>
  "Diseña actividad de arrastrar-asociar sobre [TEMA]. [N] parejas (concepto-definición, imagen-palabra, fecha-evento). Conceptos en orden de dificultad creciente. Para Wordwall. Incluye instrucciones para el estudiante."</div>

  <div class="prompt-block"><span class="prompt-tag">Encuesta inicial (Mentimeter)</span><br>
  "Genera 5 preguntas para Mentimeter (1 nube de palabras, 2 opción múltiple, 1 escala 1-5, 1 abierta) sobre [TEMA] para [GRADO]. Objetivo: sondear preconcepciones. Preguntas no obvias, que inviten a opinar, no a adivinar."</div>

  <h3 class="sub-title"><i class="fas fa-video"></i> Video-lecciones</h3>
  <div class="prompt-block"><span class="prompt-tag">Guion de video-lección (flipped)</span><br>
  "Escribe guion de video-lección de [DURACIÓN] min sobre [TEMA] para [GRADO]. Estructura: 1) Hook (15 seg, problema cotidiano), 2) Desarrollo (3 ideas clave con ejemplo), 3) Mini-reto (45 seg). Indica locución y visuals en cada segmento. Sin texto largo en pantalla."</div>

  <div class="prompt-block"><span class="prompt-tag">Screencast tutorial</span><br>
  "Escribe guion de screencast de [DURACIÓN] min para enseñar [HERRAMIENTA/PROCESO] a [GRADO]. Empieza con resultado final, retrocede para mostrar pasos. Máx 5 pasos. Indica en cada paso qué se dice y qué se hace en pantalla."</div>

  <h3 class="sub-title"><i class="fas fa-cubes"></i> Objetos de aprendizaje y gamificación</h3>
  <div class="prompt-block"><span class="prompt-tag">Objeto de aprendizaje (H5P)</span><br>
  "Estructura objeto de aprendizaje sobre [TEMA] para [GRADO]: objetivo, contenido (300 palabras), actividad interactiva (drag-drop o quiz), autoevaluación (5 preguntas), retroalimentación final. Sigue estándar SCORM. Para H5P."</div>

  <div class="prompt-block"><span class="prompt-tag">Actividad gamificada</span><br>
  "Diseña actividad gamificada de [DURACIÓN] min sobre [TEMA]: 5 retos progresivos, puntos por reto, bonus final. Mecánica clara pero sin distraer del objetivo pedagógico. Incluye leaderboard opcional. Para Kahoot/Quizizz."</div>

  <div class="prompt-block"><span class="prompt-tag">Role-play / simulación</span><br>
  "Diseña simulación de rol sobre [TEMA] para [GRADO]: [N] personajes, descripción de cada rol, instrucciones para el estudiante, criterios de evaluación. La simulación debe durar [DURACIÓN] min y abordar [OBJETIVO]."</div>

  <h3 class="sub-title"><i class="fas fa-comments"></i> Diferenciación y DUA</h3>
  <div class="prompt-block"><span class="prompt-tag">Diferenciación por nivel lector</span><br>
  "Adapta este texto a 3 niveles de lectura: 1) 3º primaria, 2) 6º primaria, 3) secundaria. Mantén idea central, ajusta vocabulario, longitud y estructura. Sin perder el contenido. Para Diffit o manual."</div>

  <div class="prompt-block"><span class="prompt-tag">Variante por estilo de aprendizaje</span><br>
  "Toma este concepto: [CONCEPTO]. Genera 3 explicaciones: 1) visual (con diagrama descrito), 2) auditiva (guión para podcast), 3) kinestésica (actividad física para entenderlo). Mismo contenido, 3 accesos."</div>

  <div class="prompt-block"><span class="prompt-tag">Ajuste por NEE</span><br>
  "Tengo este recurso: [PEGAR]. Propón 3 ajustes para estudiante con [NEE: TDAH/dislexia/TEA/discapacidad visual/etc.]. Cada ajuste debe ser viable en aula regular, sin requerir especialista, y mantener el objetivo pedagógico."</div>

  <h3 class="sub-title"><i class="fas fa-pen"></i> Textos y redacción</h3>
  <div class="prompt-block"><span class="prompt-tag">Texto nivelado</span><br>
  "Escribe un texto de [N] palabras sobre [TEMA] para [GRADO]. Tono divulgativo, no académico. 1 idea por párrafo. Oraciones máx 20 palabras. Vocabulario accesible. Cierra con pregunta abierta."</div>

  <div class="prompt-block"><span class="prompt-tag">Caso de estudio</span><br>
  "Escribe un caso de estudio de [N] palabras sobre [TEMA] para [NIVEL]. Estructura: contexto, datos, dilema, 4 preguntas de análisis (no de respuesta única). Debe estar basado en situación plausible (no real si no puedes verificar)."</div>

  <div class="prompt-block"><span class="prompt-tag">Diálogo socrático</span><br>
  "Escribe un diálogo socrático de [N] turnos entre docente y estudiante sobre [TEMA]. El docente NO da respuestas: pregunta, reta, devuelve la pregunta. El estudiante construye. Útil para modelar andamiaje."</div>

  <h3 class="sub-title"><i class="fas fa-graduation-cap"></i> Cierre de unidad / metacognición</h3>
  <div class="prompt-block"><span class="prompt-tag">Ticket de salida</span><br>
  "Genera 3 opciones de ticket de salida (5 min) sobre [TEMA]: 1) una pregunta de opción múltiple, 2) una pregunta abierta corta, 3) pedir 1 palabra que resuma lo aprendido. Cada opción me permite ver qué entendieron y qué no."</div>

  <div class="prompt-block"><span class="prompt-tag">Autoevaluación guiada</span><br>
  "Genera plantilla de autoevaluación para [PRODUCTO] de [GRADO]: 5 preguntas que el estudiante se hace a sí mismo sobre su trabajo (no sobre el contenido), 1 pregunta de metacognición ('¿qué haría distinto?'), 1 compromiso a futuro."</div>

  <div class="prompt-block"><span class="prompt-tag">Reflexión metacognitiva</span><br>
  "Escribe 6 preguntas de reflexión metacognitiva para cerrar unidad sobre [TEMA]: 1) qué aprendí, 2) qué me costó, 3) qué me sorprendió, 4) cómo lo aprendí, 5) cómo lo usaría, 6) qué quiero aprender ahora. Abiertas, no retóricas."</div>
</section>

<script>
// TEMA OSCURO
(function() {
  let saved = null;
  try { saved = localStorage.getItem('vibecoding-pedagogia-theme'); } catch(e) { saved = null; }
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  const toggle = document.getElementById('themeToggle');
  const icon = toggle.querySelector('i');
  function updateIcon() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
  }
  updateIcon();
  toggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (isDark) {
      document.documentElement.removeAttribute('data-theme');
      try { localStorage.setItem('vibecoding-pedagogia-theme', 'light'); } catch(e) {}
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      try { localStorage.setItem('vibecoding-pedagogia-theme', 'dark'); } catch(e) {}
    }
    updateIcon();
  });
})();

// MENÚ MÓVIL
document.getElementById('menuToggle').addEventListener('click', function() {
  document.getElementById('navLinks').classList.toggle('show');
});

// BARRA DE PROGRESO + ACTIVE NAV + BACK TO TOP
const progressBar = document.getElementById('progressBar');
const backToTop = document.getElementById('backToTop');
const navLinks = document.querySelectorAll('.nav-links a');
const sections = document.querySelectorAll('section[id]');

window.addEventListener('scroll', () => {
  const scrolled = window.scrollY;
  const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
  progressBar.style.width = (scrolled / totalHeight * 100) + '%';

  if (scrolled > 500) backToTop.classList.add('show');
  else backToTop.classList.remove('show');

  let current = '';
  sections.forEach(sec => {
    if (scrolled >= sec.offsetTop - 120) current = sec.id;
  });
  navLinks.forEach(link => {
    link.classList.toggle('active', link.getAttribute('href') === '#' + current);
  });
});

backToTop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));

// ACORDEÓN
document.querySelectorAll('.accordion-header').forEach(header => {
  header.addEventListener('click', function() {
    const parent = this.parentElement;
    document.querySelectorAll('.accordion-item').forEach(item => { if (item !== parent) item.classList.remove('active'); });
    parent.classList.toggle('active');
  });
});

// ESC cierra todo
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { /* sin modals */ } });

// TOAST
function showToast(message, type) {
  type = type || 'success';
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast';
  const icons = { success: 'fa-check-circle', info: 'fa-info-circle', error: 'fa-times-circle', warn: 'fa-exclamation-triangle' };
  const colors = { success: '#4ade80', info: '#38bdf8', error: '#f87171', warn: '#facc15' };
  t.innerHTML = '<i class="fas ' + (icons[type] || icons.success) + '" style="color:' + (colors[type] || colors.success) + ';"></i> ' + message + ' <button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>';
  c.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { if (t.parentNode) { t.classList.remove('show'); setTimeout(() => t.remove(), 400); } }, 3000);
}

// COPIAR AL CLIPBOARD
document.querySelectorAll('.cdn-code').forEach(el => {
  el.addEventListener('click', function() {
    navigator.clipboard.writeText(this.innerText).then(() => showToast('CDN copiado al portapapeles'));
  });
});

// COPIAR PROMPT-BLOCK (todo el contenido textual)
document.querySelectorAll('.prompt-block').forEach(el => {
  el.style.cursor = 'pointer';
  el.title = 'Clic para copiar el prompt';
  el.addEventListener('click', function(e) {
    if (e.target.tagName === 'CODE') return; // no interferir si clickean un code específico
    const text = this.innerText.replace(/^\u25B6\s*/, '').trim();
    navigator.clipboard.writeText(text).then(() => showToast('Prompt copiado al portapapeles'));
  });
});

// BÚSQUEDA en nav
const searchBox = document.getElementById('searchBox');
searchBox.addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll('section.component-group').forEach(sec => {
    if (!q) { sec.style.display = ''; return; }
    const text = sec.textContent.toLowerCase();
    sec.style.display = text.includes(q) ? '' : 'none';
  });
});

/* Drag and drop categorize */
.categorize-container { display: flex; flex-direction: column; gap: 20px; }

.presentation-deck { position: relative; background: linear-gradient(135deg, #4a2c1a, #1c1408); border-radius: 12px; min-height: 320px; padding: 32px; color: white; box-shadow: var(--shadow-md); overflow: hidden; }

.presentation-slide.active { display: block; animation: slideIn 0.4s ease; }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
.presentation-slide h2 { color: #f97316; margin-bottom: 14px; font-size: 1.6rem; }
.presentation-slide ul { list-style: none; padding: 0; }
.presentation-slide li { padding: 8px 0; font-size: 1rem; padding-left: 28px; position: relative; }
.presentation-slide li::before { content: "\f0da"; font-family: "Font Awesome 6 Free"; font-weight: 900; color: #f97316; position: absolute; left: 8px; }
.presentation-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
.presentation-counter { color: #d4b896; font-size: 0.9rem; }

/* Simulación ciclo del agua */
.water-cycle { position: relative; width: 100%; max-width: 540px; height: 320px; margin: 0 auto; background: linear-gradient(180deg, #87ceeb 0%, #b3ddff 60%, #7fbf7f 60%, #5ca55c 100%); border-radius: 12px; overflow: hidden; }
.water-sun { position: absolute; top: 20px; right: 20px; width: 50px; height: 50px; background: radial-gradient(circle, #facc15, #f59e0b); border-radius: 50%; box-shadow: 0 0 30px #facc15; cursor: pointer; transition: all 0.3s; }
.water-cloud { position: absolute; top: 30px; left: 60px; font-size: 2.5rem; cursor: pointer; transition: all 0.5s; opacity: 0.6; }
.water-cloud.active { transform: translateX(80px); opacity: 1; }
.water-rain { position: absolute; top: 80px; left: 200px; font-size: 1.5rem; display: none; }
.water-rain.active { display: block; animation: rain 1s linear infinite; }
@keyframes rain { from { transform: translateY(0); } to { transform: translateY(180px); } }
.water-pool { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: linear-gradient(180deg, #4a9eff, #2563eb); }
.water-evapor { position: absolute; bottom: 60px; left: 50px; font-size: 1.2rem; opacity: 0; transition: opacity 0.3s; }
.water-evapor.active { opacity: 1; animation: evapor 2s linear infinite; }
@keyframes evapor { from { transform: translateY(0); opacity: 0.8; } to { transform: translateY(-200px); opacity: 0; } }
.water-info { text-align: center; margin-top: 14px; padding: 12px; background: var(--accent-soft); border-radius: 8px; color: var(--accent-deep); font-size: 0.92rem; min-height: 50px; }
.water-btn { display: block; margin: 12px auto 0; }

/* Línea de tiempo */
.timeline { position: relative; padding-left: 32px; }
.timeline::before { content: ''; position: absolute; left: 12px; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, var(--accent), var(--purple)); border-radius: 3px; }
.timeline-item { position: relative; padding: 14px 0 14px 20px; cursor: pointer; }
.timeline-item::before { content: ''; position: absolute; left: -25px; top: 22px; width: 14px; height: 14px; background: var(--card-bg); border: 3px solid var(--accent); border-radius: 50%; transition: all 0.3s; z-index: 2; }
.timeline-item:hover::before, .timeline-item.active::before { background: var(--accent); transform: scale(1.3); }
.timeline-year { font-weight: 700; color: var(--accent-deep); font-size: 1rem; margin-bottom: 4px; }
.timeline-title { font-weight: 600; color: var(--text); margin-bottom: 4px; }
.timeline-detail { color: var(--text-soft); font-size: 0.88rem; max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
.timeline-item.active .timeline-detail { max-height: 200px; padding-top: 6px; }

/* Rúbrica autoevaluación */
.rubric-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-sm); }
.rubric-table th, .rubric-table td { padding: 10px 12px; border: 1px solid var(--card-border); text-align: center; color: var(--text); font-size: 0.85rem; vertical-align: middle; }
.rubric-table th { background: var(--accent-soft); color: var(--accent-deep); font-weight: 600; }
.rubric-radio { cursor: pointer; width: 22px; height: 22px; accent-color: var(--accent); }
.rubric-result { padding: 14px; background: var(--accent-soft); border-radius: 8px; text-align: center; margin-top: 14px; color: var(--accent-deep); font-weight: 600; display: none; }
.rubric-result.show { display: block; }

/* Caso ramificado */
.case-scenario { background: var(--bg); padding: 18px; border-radius: 10px; border-left: 4px solid var(--accent); margin-bottom: 14px; line-height: 1.6; }
.case-scenario strong { color: var(--accent-deep); }
.case-question { color: var(--text); font-weight: 600; margin: 12px 0; }
.case-options { display: flex; flex-direction: column; gap: 8px; }
.case-option { padding: 12px 16px; background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 8px; cursor: pointer; transition: all 0.2s; color: var(--text); text-align: left; font-size: 0.92rem; }
.case-option:hover { border-color: var(--accent); background: var(--accent-soft); }
.case-feedback { padding: 14px; border-radius: 8px; margin-top: 12px; display: none; line-height: 1.6; }
.case-feedback.show { display: block; }
.case-feedback.good { background: rgba(22,163,74,0.1); color: var(--good); }
.case-feedback.bad { background: rgba(220,38,38,0.1); color: var(--bad); }

/* Crucigrama */
.crossword-grid { display: grid; grid-template-columns: repeat(8, 36px); gap: 2px; margin: 0 auto; max-width: 320px; }
.crossword-cell { width: 36px; height: 36px; background: var(--card-bg); border: 1.5px solid var(--card-border); display: flex; align-items: center; justify-content: center; position: relative; }
.crossword-cell.blocked { background: #2a2218; border: none; }
.crossword-cell input { width: 100%; height: 100%; border: none; text-align: center; font-size: 1rem; font-weight: 600; text-transform: uppercase; color: var(--text); background: transparent; outline: none; }
.crossword-cell input:focus { background: var(--accent-soft); }
.crossword-num { position: absolute; top: 1px; left: 2px; font-size: 0.6rem; color: var(--text-mute); pointer-events: none; }
.crossword-clues { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 18px; }
.crossword-clue { font-size: 0.85rem; color: var(--text-soft); padding: 4px 0; }
.crossword-clue strong { color: var(--accent-deep); }

/* Ordenar secuencia */
.sequence-container { display: flex; flex-direction: column; gap: 10px; max-width: 500px; margin: 0 auto; }
.sequence-item { padding: 14px 18px; background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 10px; cursor: grab; color: var(--text); user-select: none; transition: all 0.2s; display: flex; align-items: center; gap: 12px; }
.sequence-item:hover { border-color: var(--accent); }
.sequence-item.dragging { opacity: 0.5; cursor: grabbing; }
.sequence-item .seq-num { background: var(--accent); color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
.sequence-result { text-align: center; padding: 14px; border-radius: 8px; margin-top: 14px; font-weight: 600; display: none; }
.sequence-result.show { display: block; }
.sequence-result.good { background: rgba(22,163,74,0.1); color: var(--good); }
.sequence-result.bad { background: rgba(220,38,38,0.1); color: var(--bad); }

      <pre>&lt;!DOCTYPE html&gt;
&lt;html lang="es"&gt;
&lt;head&gt;&lt;meta charset="UTF-8"&gt;&lt;title&gt;Examen interactivo&lt;/title&gt;
&lt;style&gt;
  body { font-family: system-ui, sans-serif; padding: 20px; max-width: 700px; margin: 0 auto; }
  .quiz-question { background: #f9f7f2; border: 2px solid #ece5db; border-radius: 10px; padding: 18px; margin-bottom: 14px; }

  .quiz-option:hover { border-color: #c2410c; background: #fef3e7; }
  .quiz-option.correct { border-color: #16a34a; background: rgba(22,163,74,0.1); color: #16a34a; }
  .quiz-option.incorrect { border-color: #dc2626; background: rgba(220,38,38,0.1); color: #dc2626; }

  .quiz-feedback.show { display: block; }
  .quiz-feedback.good { background: rgba(22,163,74,0.1); color: #16a34a; }
  .quiz-feedback.bad { background: rgba(220,38,38,0.1); color: #dc2626; }
  .quiz-score { padding: 18px; background: #fef3e7; border-radius: 10px; text-align: center; font-weight: 600; color: #9a3412; margin-top: 16px; display: none; }
  .quiz-score.show { display: block; }
  button.primary { background: #c2410c; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; }
&lt;/style&gt;&lt;/head&gt;
&lt;body&gt;
&lt;h1&gt;Examen de conocimiento general&lt;/h1&gt;
&lt;div class="quiz-question" data-correct="b"&gt;
  &lt;h4&gt;1. ¿Cuál es la capital de Brasil?&lt;/h4&gt;
  &lt;div class="quiz-options"&gt;
    &lt;button class="quiz-option" data-opt="a"&gt;a) Río de Janeiro&lt;/button&gt;
    &lt;button class="quiz-option" data-opt="b"&gt;b) Brasilia&lt;/button&gt;
    &lt;button class="quiz-option" data-opt="c"&gt;c) São Paulo&lt;/button&gt;
    &lt;button class="quiz-option" data-opt="d"&gt;d) Salvador&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class="quiz-feedback"&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class="quiz-question" data-correct="c"&gt;
  &lt;h4&gt;2. ¿Quién escribió "Cien años de soledad"?&lt;/h4&gt;
  &lt;div class="quiz-options"&gt;
    &lt;button class="quiz-option" data-opt="a"&gt;a) Julio Cortázar&lt;/button&gt;
    &lt;button class="quiz-option" data-opt="b"&gt;b) Pablo Neruda&lt;/button&gt;
    &lt;button class="quiz-option" data-opt="c"&gt;c) Gabriel García Márquez&lt;/button&gt;
    &lt;button class="quiz-option" data-opt="d"&gt;d) Mario Vargas Llosa&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class="quiz-feedback"&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class="quiz-question" data-correct="b"&gt;
  &lt;h4&gt;3. ¿En qué año llegó el ser humano a la Luna?&lt;/h4&gt;
  &lt;div class="quiz-options"&gt;
    &lt;button class="quiz-option" data-opt="a"&gt;a) 1957&lt;/button&gt;
    &lt;button class="quiz-option" data-opt="b"&gt;b) 1969&lt;/button&gt;
    &lt;button class="quiz-option" data-opt="c"&gt;c) 1972&lt;/button&gt;
    &lt;button class="quiz-option" data-opt="d"&gt;d) 1981&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class="quiz-feedback"&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;button class="primary" onclick="finishQuiz()"&gt;Ver resultado&lt;/button&gt;
&lt;div class="quiz-score" id="quizScore"&gt;&lt;/div&gt;

&lt;script&gt;
const answers = {};
document.querySelectorAll('.quiz-question').forEach(q =&gt; {
  const correct = q.dataset.correct;
  q.querySelectorAll('.quiz-option').forEach(opt =&gt; {
    opt.addEventListener('click', () =&gt; {
      q.querySelectorAll('.quiz-option').forEach(o =&gt; { o.classList.remove('correct','incorrect'); o.disabled = false; });
      const feedback = q.querySelector('.quiz-feedback');
      if (opt.dataset.opt === correct) {
        opt.classList.add('correct');
        feedback.textContent = '✓ Correcto. ¡Bien hecho!';
        feedback.className = 'quiz-feedback show good';
        answers[q.querySelector('h4').textContent] = true;
      } else {
        opt.classList.add('incorrect');
        feedback.textContent = '✗ Incorrecto. La respuesta correcta era: ' + q.querySelector('[data-opt="' + correct + '"]').textContent;
        feedback.className = 'quiz-feedback show bad';
        answers[q.querySelector('h4').textContent] = false;
      }
      q.querySelectorAll('.quiz-option').forEach(o =&gt; o.disabled = true);
    });
  });
});

function finishQuiz() {
  const total = document.querySelectorAll('.quiz-question').length;
  const correctCount = Object.values(answers).filter(v =&gt; v === true).length;
  const score = document.getElementById('quizScore');
  score.textContent = 'Resultado: ' + correctCount + ' de ' + total + ' correctas (' + Math.round(correctCount/total*100) + '%)';
  score.classList.add('show');
}
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;</pre>

&lt;body&gt;
&lt;h1&gt;Flashcards: Conceptos clave&lt;/h1&gt;

      &lt;div class="label"&gt;Concepto&lt;/div&gt;

    &lt;/div&gt;
    &lt;div class="flashcard-back"&gt;
      &lt;div class="definition" id="backDef"&gt;Proceso por el cual las plantas convierten luz solar, agua y CO₂ en glucosa y oxígeno.&lt;/div&gt;
    &lt;/div&gt;

&lt;div class="nav-btns"&gt;

  &lt;button onclick="next()"&gt;&amp;#8594;&lt;/button&gt;
&lt;/div&gt;
&lt;script&gt;
const cards = [
  { word: 'Fotosíntesis', def: 'Proceso por el cual las plantas convierten luz solar, agua y CO₂ en glucosa y oxígeno. Ocurre en los cloroplastos.' },
  { word: 'Respiración celular', def: 'Proceso en el que las células descomponen glucosa con oxígeno para producir energía (ATP), agua y CO₂.' },

];
let current = 0;
function update() {
  document.getElementById('frontWord').textContent = cards[current].word;
  document.getElementById('backDef').textContent = cards[current].def;
  document.getElementById('counter').textContent = (current+1) + ' / ' + cards.length;

    <h3><i class="fas fa-code"></i> Código HTML+CSS+JS autocontenido (copia y pega en tu LMS)</h3>
    <div class="code-block">
      <button class="copy-btn" onclick="copyText(this.nextElementSibling.innerText)"><i class="fas fa-copy"></i> Copiar código</button>
      <pre>&lt;!DOCTYPE html&gt;
&lt;html lang="es"&gt;
&lt;head&gt;&lt;meta charset="UTF-8"&gt;&lt;title&gt;Conexión de ideas&lt;/title&gt;
&lt;style&gt;
  body { font-family: system-ui, sans-serif; padding: 20px; max-width: 700px; margin: 0 auto; }
  .matching-container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; position: relative; min-height: 280px; }
  .matching-col { display: flex; flex-direction: column; gap: 12px; }
  .match-item { padding: 12px 18px; background: white; border: 2px solid #ece5db; border-radius: 10px; cursor: pointer; text-align: center; color: #2a2218; position: relative; z-index: 2; }
  .match-item:hover { border-color: #c2410c; }
  .match-item.selected { background: #c2410c; color: white; border-color: #c2410c; }
  .match-item.matched { background: rgba(22,163,74,0.1); border-color: #16a34a; color: #16a34a; pointer-events: none; }
  .match-svg { position: absolute; inset: 0; pointer-events: none; z-index: 1; width: 100%; height: 100%; }
  .match-line { stroke: #16a34a; stroke-width: 3; }
  .result { text-align: center; padding: 14px; background: #fef3e7; border-radius: 8px; color: #9a3412; font-weight: 600; margin-top: 16px; }
&lt;/style&gt;&lt;/head&gt;
&lt;body&gt;
&lt;h1&gt;Conecta cada concepto con su definición&lt;/h1&gt;
&lt;div class="matching-container"&gt;
  &lt;svg class="match-svg" id="svg"&gt;&lt;line class="match-line" id="line" x1="0" y1="0" x2="0" y2="0" style="display:none;"/&gt;&lt;/svg&gt;
  &lt;div class="matching-col" id="left"&gt;
    &lt;div class="match-item" data-side="left" data-pair="1"&gt;Fotosíntesis&lt;/div&gt;
    &lt;div class="match-item" data-side="left" data-pair="2"&gt;Respiración celular&lt;/div&gt;
    &lt;div class="match-item" data-side="left" data-pair="3"&gt;Transpiración&lt;/div&gt;
    &lt;div class="match-item" data-side="left" data-pair="4"&gt;Nutrición&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="matching-col" id="right"&gt;
    &lt;div class="match-item" data-side="right" data-pair="2"&gt;Libera CO₂ y agua&lt;/div&gt;
    &lt;div class="match-item" data-side="right" data-pair="4"&gt;Absorción de minerales&lt;/div&gt;
    &lt;div class="match-item" data-side="right" data-pair="1"&gt;Captura CO₂ y libera O₂&lt;/div&gt;
    &lt;div class="match-item" data-side="right" data-pair="3"&gt;Pérdida de vapor de agua&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class="result" id="result" style="display:none;"&gt;&lt;/div&gt;
&lt;script&gt;
let selected = null;
let matched = 0;
document.querySelectorAll('.match-item').forEach(item =&gt; {
  item.addEventListener('click', () =&gt; {
    if (item.classList.contains('matched')) return;
    if (!selected) {
      selected = item;
      item.classList.add('selected');
    } else {
      if (selected.dataset.side !== item.dataset.side) {
        if (selected.dataset.pair === item.dataset.pair) {
          selected.classList.add('matched');
          item.classList.add('matched');
          drawLine(selected, item);
          matched++;
          if (matched === 4) {
            document.getElementById('result').textContent = '¡Felicidades! Conectaste todas las ideas.';
            document.getElementById('result').style.display = 'block';
          }
        } else {
          // parpadeo rojo
          const orig1 = selected.style.background, orig2 = item.style.background;
          selected.style.background = 'rgba(220,38,38,0.3)';
          item.style.background = 'rgba(220,38,38,0.3)';
          setTimeout(() =&gt; {
            selected.style.background = orig1;
            item.style.background = orig2;
            selected.classList.remove('selected');
          }, 400);
        }
        selected.classList.remove('selected');
        selected = null;
      } else {
        selected.classList.remove('selected');
        selected = item;
        item.classList.add('selected');
      }
    }
  });
});
function drawLine(a, b) {
  const svg = document.getElementById('svg');
  const aRect = a.getBoundingClientRect(), bRect = b.getBoundingClientRect();
  const container = document.querySelector('.matching-container').getBoundingClientRect();
  const x1 = aRect.right - container.left, y1 = aRect.top + aRect.height/2 - container.top;
  const x2 = bRect.left - container.left, y2 = bRect.top + bRect.height/2 - container.top;
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  line.setAttribute('class', 'match-line');
  svg.appendChild(line);
}
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;</pre>
    </div>
  </div>
</section>

&lt;html lang="es"&gt;
&lt;head&gt;&lt;meta charset="UTF-8"&gt;&lt;title&gt;Categorización drag-and-drop&lt;/title&gt;

&lt;script&gt;

document.querySelectorAll('.item').forEach(item =&gt; {

&lt;html lang="es"&gt;
&lt;head&gt;&lt;meta charset="UTF-8"&gt;&lt;title&gt;Presentación navegable&lt;/title&gt;
&lt;style&gt;
  body { font-family: system-ui, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
  .deck { background: linear-gradient(135deg, #4a2c1a, #1c1408); border-radius: 12px; min-height: 320px; padding: 32px; color: white; box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
  .slide { display: none; }
  .slide.active { display: block; animation: slideIn 0.4s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  .slide h2 { color: #f97316; margin-bottom: 14px; font-size: 1.6rem; }
  .slide ul { list-style: none; padding: 0; }
  .slide li { padding: 8px 0; font-size: 1rem; padding-left: 28px; position: relative; }
  .slide li::before { content: "→"; color: #f97316; position: absolute; left: 8px; }
  .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .controls button { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 8px 16px; border-radius: 8px; cursor: pointer; }
  .counter { color: #d4b896; }
&lt;/style&gt;&lt;/head&gt;
&lt;body&gt;
&lt;div class="deck"&gt;
  &lt;div class="slide active"&gt;
    &lt;h2&gt;La célula&lt;/h2&gt;
    &lt;p&gt;Unidad fundamental de la vida.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="slide"&gt;
    &lt;h2&gt;Partes principales&lt;/h2&gt;
    &lt;ul&gt;&lt;li&gt;Núcleo: contiene el ADN&lt;/li&gt;&lt;li&gt;Citoplasma&lt;/li&gt;&lt;li&gt;Membrana&lt;/li&gt;&lt;li&gt;Mitocondrias: energía&lt;/li&gt;&lt;/ul&gt;
  &lt;/div&gt;
  &lt;div class="slide"&gt;
    &lt;h2&gt;Tipos de células&lt;/h2&gt;
    &lt;ul&gt;&lt;li&gt;Procariota&lt;/li&gt;&lt;li&gt;Eucariota animal&lt;/li&gt;&lt;li&gt;Eucariota vegetal&lt;/li&gt;&lt;/ul&gt;
  &lt;/div&gt;
  &lt;div class="slide"&gt;
    &lt;h2&gt;Reflexión&lt;/h2&gt;
    &lt;p&gt;¿Cuál es la función de la mitocondria?&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="controls"&gt;
    &lt;button onclick="prev()"&gt;&amp;#8592;&lt;/button&gt;
    &lt;span class="counter" id="counter"&gt;1 / 4&lt;/span&gt;
    &lt;button onclick="next()"&gt;&amp;#8594;&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
let current = 0;
const slides = document.querySelectorAll('.slide');
function show(i) {
  slides.forEach(s =&gt; s.classList.remove('active'));
  slides[i].classList.add('active');
  document.getElementById('counter').textContent = (i+1) + ' / ' + slides.length;
}
function next() { if (current &lt; slides.length-1) { current++; show(current); } }
function prev() { if (current &gt; 0) { current--; show(current); } }
document.addEventListener('keydown', e =&gt; {
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;</pre>

&lt;h1&gt;Autoevaluación de ensayo argumentativo&lt;/h1&gt;
&lt;p&gt;Selecciona el nivel que crees que alcanzaste en cada criterio.&lt;/p&gt;
&lt;table&gt;
  &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Criterio (peso)&lt;/th&gt;&lt;th&gt;Inicial (1)&lt;/th&gt;&lt;th&gt;En desarrollo (2)&lt;/th&gt;&lt;th&gt;Logrado (3)&lt;/th&gt;&lt;th&gt;Sobresaliente (4)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
  &lt;tbody&gt;
    &lt;tr data-weight="0.25"&gt;&lt;td&gt;Tesis (25%)&lt;/td&gt;
      &lt;td&gt;&lt;input type="radio" name="c1" value="1" onclick="calc()"&gt;&lt;/td&gt;&lt;td&gt;&lt;input type="radio" name="c1" value="2" onclick="calc()"&gt;&lt;/td&gt;
      &lt;td&gt;&lt;input type="radio" name="c1" value="3" onclick="calc()"&gt;&lt;/td&gt;&lt;td&gt;&lt;input type="radio" name="c1" value="4" onclick="calc()"&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-weight="0.30"&gt;&lt;td&gt;Evidencias (30%)&lt;/td&gt;
      &lt;td&gt;&lt;input type="radio" name="c2" value="1" onclick="calc()"&gt;&lt;/td&gt;&lt;td&gt;&lt;input type="radio" name="c2" value="2" onclick="calc()"&gt;&lt;/td&gt;
      &lt;td&gt;&lt;input type="radio" name="c2" value="3" onclick="calc()"&gt;&lt;/td&gt;&lt;td&gt;&lt;input type="radio" name="c2" value="4" onclick="calc()"&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-weight="0.20"&gt;&lt;td&gt;Contraargumentación (20%)&lt;/td&gt;
      &lt;td&gt;&lt;input type="radio" name="c3" value="1" onclick="calc()"&gt;&lt;/td&gt;&lt;td&gt;&lt;input type="radio" name="c3" value="2" onclick="calc()"&gt;&lt;/td&gt;
      &lt;td&gt;&lt;input type="radio" name="c3" value="3" onclick="calc()"&gt;&lt;/td&gt;&lt;td&gt;&lt;input type="radio" name="c3" value="4" onclick="calc()"&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-weight="0.25"&gt;&lt;td&gt;Registro académico (25%)&lt;/td&gt;
      &lt;td&gt;&lt;input type="radio" name="c4" value="1" onclick="calc()"&gt;&lt;/td&gt;&lt;td&gt;&lt;input type="radio" name="c4" value="2" onclick="calc()"&gt;&lt;/td&gt;
      &lt;td&gt;&lt;input type="radio" name="c4" value="3" onclick="calc()"&gt;&lt;/td&gt;&lt;td&gt;&lt;input type="radio" name="c4" value="4" onclick="calc()"&gt;&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;
&lt;/table&gt;
&lt;div class="result" id="result"&gt;&lt;/div&gt;
&lt;script&gt;
function calc() {
  let total = 0, complete = true;
  document.querySelectorAll('tbody tr').forEach(row =&gt; {
    const selected = row.querySelector('input:checked');
    if (selected) {
      total += parseInt(selected.value) * parseFloat(row.dataset.weight);
    } else { complete = false; }
  });
  const result = document.getElementById('result');
  if (complete) {
    result.textContent = 'Puntaje total: ' + total.toFixed(2) + ' / 4.00';
    result.classList.add('show');
  }
}
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;</pre>

      <pre>&lt;!DOCTYPE html&gt;
&lt;html lang="es"&gt;
&lt;head&gt;&lt;meta charset="UTF-8"&gt;&lt;title&gt;Caso ramificado&lt;/title&gt;
&lt;style&gt;
  body { font-family: system-ui, sans-serif; padding: 20px; max-width: 700px; margin: 0 auto; }
  .scenario { background: #f9f7f2; padding: 18px; border-radius: 10px; border-left: 4px solid #c2410c; margin-bottom: 14px; line-height: 1.6; }
  .question { color: #2a2218; font-weight: 600; margin: 12px 0; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option { padding: 12px 16px; background: white; border: 2px solid #ece5db; border-radius: 8px; cursor: pointer; color: #2a2218; }

  .feedback.good { background: rgba(22,163,74,0.1); color: #16a34a; }
  .feedback.bad { background: rgba(220,38,38,0.1); color: #dc2626; }
  button.next { margin-top: 12px; padding: 8px 18px; background: #c2410c; color: white; border: none; border-radius: 8px; cursor: pointer; }
&lt;/style&gt;&lt;/head&gt;
&lt;body&gt;
&lt;h1&gt;Caso práctico: Estudiante retraído&lt;/h1&gt;
&lt;div class="scenario" id="scenario"&gt;&lt;/div&gt;
&lt;div class="question"&gt;Selecciona tu acción:&lt;/div&gt;
&lt;div class="options" id="options"&gt;&lt;/div&gt;
&lt;div class="feedback" id="feedback"&gt;&lt;/div&gt;
&lt;script&gt;
const scenarios = [
  { text: 'Eres docente de 5º. Un estudiante retraído 2 semanas, padres separándose. ¿Qué haces primero?', options: [
    { text: 'a) Hablar en privado, con calma, escuchar', feedback: '✓ ¡Bien! Muestra empatía y respeta privacidad.', type: 'good', next: 1 },
    { text: 'b) Llamarlo frente al grupo', feedback: '✗ Mal. Lo expone.', type: 'bad', next: 0 },
    { text: 'c) Esperar, se recupera solo', feedback: '✗ Mal. El retraimiento prolongado puede ser señal de algo serio.', type: 'bad', next: 0 },
    { text: 'd) Coordinarte con el tutor escolar', feedback: '✓ ¡Bien! Intervención informada.', type: 'good', next: 1 } ] },
  { text: 'Tras tu intervención, el estudiante te cuenta que sus padres pelean mucho y él siente culpa. ¿Cómo respondes?', options: [
    { text: 'a) Validas emociones y desmontas la culpa', feedback: '✓ Bien. Validación emocional es andamiaje clave.', type: 'good', next: 2 },
    { text: 'b) Le dices que eso pasa en muchas casas', feedback: '✗ Mal. Minimiza su dolor.', type: 'bad', next: 1 } ] },
  { text: 'Otro estudiante hace comentarios despectivos sobre la situación familiar del primero. ¿Cómo actúas?', options: [
    { text: 'a) Intervienes en privado con el autor, sin exponer al afectado', feedback: '✓ ¡Caso cerrado! Protegiste dignidad y educaste. Práctica docente recomendada.', type: 'good', next: -1 },
    { text: 'b) Llamas la atención públicamente', feedback: '✗ Mal. Dirige más atención al caso.', type: 'bad', next: 2 } ] }
];
let current = 0;
function render() {
  const sc = scenarios[current];
  document.getElementById('scenario').innerHTML = '&lt;strong&gt;Escenario ' + (current+1) + ' de ' + scenarios.length + ':&lt;/strong&gt; ' + sc.text;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  sc.options.forEach((opt, i) =&gt; {
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = opt.text;
    div.onclick = () =&gt; choose(i);
    opts.appendChild(div);
  });
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
}
function choose(idx) {
  const opt = scenarios[current].options[idx];
  const fb = document.getElementById('feedback');
  let html = opt.feedback;
  if (opt.type === 'good' &amp;&amp; opt.next &gt;= 0) {
    html += '&lt;br&gt;&lt;button class="next" onclick="goNext(' + opt.next + ')"&gt;Siguiente situación →&lt;/button&gt;';
  } else if (opt.next === -1) {
    html += '&lt;br&gt;&lt;button class="next" onclick="reset()"&gt;Volver a empezar&lt;/button&gt;';
  }
  fb.innerHTML = html;
  fb.className = 'feedback show ' + opt.type;
}
function goNext(idx) { current = idx; render(); }
function reset() { current = 0; render(); }
render();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;</pre>

&lt;div class="result" id="result"&gt;&lt;/div&gt;
&lt;script&gt;
let dragged = null;
document.querySelectorAll('.item').forEach(item =&gt; {
  item.addEventListener('dragstart', e =&gt; { dragged = item; e.dataTransfer.effectAllowed = 'move'; });
  item.addEventListener('dragover', e =&gt; e.preventDefault());
  item.addEventListener('drop', e =&gt; {
    e.preventDefault();
    if (dragged &amp;&amp; dragged !== item) {
      const box = document.getElementById('box');
      const items = [...box.children];
      const draggedIdx = items.indexOf(dragged);
      const targetIdx = items.indexOf(item);
      if (draggedIdx &lt; targetIdx) box.insertBefore(dragged, item.nextSibling);
      else box.insertBefore(dragged, item);
    }
  });
});
function check() {
  const items = [...document.querySelectorAll('.item')];
  let correct = true;
  items.forEach((item, idx) =&gt; {
    if (parseInt(item.dataset.order) !== idx + 1) correct = false;
  });
  const r = document.getElementById('result');
  if (correct) { r.textContent = '✓ ¡Secuencia correcta! Bien hecho.'; r.className = 'result show good'; }
  else { r.textContent = '✗ Aún no está en el orden correcto. Sigue intentando.'; r.className = 'result show bad'; }
}
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;</pre>

// Matching
let matchSelected = null;
let matchCount = 0;
const matchLines = [];
document.querySelectorAll('#matchingDemo .match-item').forEach(item => {
  item.addEventListener('click', () => {
    if (item.classList.contains('matched')) return;
    if (!matchSelected) {
      matchSelected = item;
      item.classList.add('selected');
    } else {
      if (matchSelected.dataset.side !== item.dataset.side) {
        if (matchSelected.dataset.pair === item.dataset.pair) {
          matchSelected.classList.add('matched');
          item.classList.add('matched');
          matchSelected.classList.remove('selected');
          drawMatchLine(matchSelected, item);
          matchCount++;
          if (matchCount === 4) {
            const r = document.getElementById('matchResult');
            r.textContent = '¡Felicidades! Conectaste todas las ideas.';
            r.style.display = 'block';
          }
          matchSelected = null;
        } else {
          const orig1 = matchSelected.style.background, orig2 = item.style.background;
          matchSelected.style.background = 'rgba(220,38,38,0.3)';
          item.style.background = 'rgba(220,38,38,0.3)';
          const sel = matchSelected;
          setTimeout(() => {
            sel.style.background = orig1;
            item.style.background = orig2;
            sel.classList.remove('selected');
          }, 400);
          matchSelected = null;
        }
      } else {
        matchSelected.classList.remove('selected');
        matchSelected = item;
        item.classList.add('selected');
      }
    }
  });
});
function drawMatchLine(a, b) {
  const svg = document.getElementById('matchSvg');
  const container = document.getElementById('matchingDemo').getBoundingClientRect();
  const aRect = a.getBoundingClientRect(), bRect = b.getBoundingClientRect();
  const x1 = aRect.right - container.left, y1 = aRect.top + aRect.height/2 - container.top;
  const x2 = bRect.left - container.left, y2 = bRect.top + bRect.height/2 - container.top;
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);

// Rúbrica
function calcRubric() {

// Caso ramificado
const caseScenarios = [
  { text: 'Eres docente de 5º de primaria. Un estudiante que tradicionalmente participaba mucho lleva 2 semanas retraído, sin hablar con nadie, sin entregar tareas. Sus compañeros comentan que sus padres se están separando. ¿Qué haces primero?', options: [
    { text: 'a) Hablar con él en privado, con calma, sin presionar, y escuchar', feedback: '✓ <strong>¡Buena decisión!</strong> Muestra empatía y respeta privacidad. El estudiante necesita sentirse seguro antes de abrirse.', type: 'good', next: 1 },
    { text: 'b) Llamarlo frente al grupo para preguntarle qué le pasa', feedback: '✗ Mal. Lo expone y puede aumentar su retraimiento. Considera mejor las opciones a) o d).', type: 'bad', next: 0 },
    { text: 'c) Esperar: los niños se recuperan solos', feedback: '✗ Mal. El retraimiento prolongado puede ser señal de algo más serio. No actuar puede empeorar la situación.', type: 'bad', next: 0 },
    { text: 'd) Coordinarte con el tutor escolar antes de actuar', feedback: '✓ <strong>¡Buena decisión!</strong> El tutor puede tener contexto familiar y profesional que tú no. Intervención informada > intervención impulsiva.', type: 'good', next: 1 } ] },
  { text: 'Tras tu intervención, el estudiante te cuenta que sus padres se pelean mucho en casa y él siente que es su culpa. ¿Cómo respondes?', options: [
    { text: 'a) Validas sus emociones: "Es normal sentirse así; gracias por compartirlo conmigo, no tienes la culpa"', feedback: '✓ Bien. Validas su emoción y desmontas la culpa. Esto es andamiaje emocional clave para que pueda seguir aprendiendo.', type: 'good', next: 2 },
    { text: 'b) Le dices que eso pasa en muchas casas y que no se preocupe', feedback: '✗ Mal. Minimiza su dolor y bloquea la confianza que acaba de abrir. Mejor: valida primero.', type: 'bad', next: 1 } ] },
  { text: 'Notas que otro estudiante hace comentarios despectivos sobre la situación familiar del primero. ¿Cómo actúas?', options: [
    { text: 'a) Intervienes con el autor del comentario en privado, sin exponer al estudiante afectado, conversando con calma', feedback: '✓ <strong>¡Caso cerrado con éxito!</strong> Protegiste la dignidad del estudiante, educaste al autor del comentario, y abriste conversación con el tutor. Esta secuencia es la práctica docente recomendada.', type: 'good', next: -1 },
    { text: 'b) Llamas la atención públicamente al que hizo el comentario', feedback: '✗ Mal. Dirige más atención al caso, exponiendo al estudiante. Intervención privada es mejor.', type: 'bad', next: 2 } ] }
];
let currentCase = 0;
function chooseCase(optIdx) {

    html += '<br><button class="btn btn-success" style="margin-top:10px;" onclick="resetCase()"><i class="fas fa-rotate-right"></i> Volver a empezar</button>';
  }
  fb.innerHTML = html;
  fb.className = 'case-feedback show ' + opt.type;
}
function nextCase(idx) {
  currentCase = idx;
  const sc = caseScenarios[idx];
  document.getElementById('caseScenario').innerHTML = '<strong>Escenario ' + (idx + 1) + ' de ' + caseScenarios.length + ':</strong> ' + sc.text;
  const opts = document.getElementById('caseOptions');
  opts.innerHTML = '';
  sc.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'case-option';
    div.textContent = opt.text;
    div.onclick = () => chooseCase(i);
    opts.appendChild(div);
  });
  const fb = document.getElementById('caseFeedback');
  fb.className = 'case-feedback';
  fb.innerHTML = '';
}
function resetCase() {
  nextCase(0);
}

// Crucigrama
function checkCrossword() {
  const answers = { '0-2':'P','0-3':'A','0-4':'R','0-5':'I','0-6':'S',
                    '2-1':'S','3-1':'U','4-1':'C','5-1':'I','6-1':'O' };
  let correct = 0, total = 0;
  document.querySelectorAll('.crossword-cell input[data-pos]').forEach(inp => {
    total++;
    if (inp.value.toUpperCase() === answers[inp.dataset.pos]) {
      inp.style.background = 'rgba(22,163,74,0.25)';
      inp.style.color = 'var(--good)';
      correct++;
    } else {
      inp.style.background = 'rgba(220,38,38,0.25)';
      inp.style.color = 'var(--bad)';
    }
  });
  const r = document.getElementById('crosswordResult');
  r.textContent = 'Correctas: ' + correct + ' de ' + total;
  r.classList.add('show');
}

// Secuencia (drag-and-drop)
let seqDragged = null;
document.querySelectorAll('#sequenceBox .sequence-item').forEach(item => {
  item.addEventListener('dragstart', e => { seqDragged = item; e.dataTransfer.effectAllowed = 'move'; item.classList.add('dragging'); });
  item.addEventListener('dragend', () => item.classList.remove('dragging'));
  item.addEventListener('dragover', e => e.preventDefault());
  item.addEventListener('drop', e => {
    e.preventDefault();
    if (seqDragged && seqDragged !== item) {
      const box = document.getElementById('sequenceBox');
      const items = [...box.children];
      const draggedIdx = items.indexOf(seqDragged);
      const targetIdx = items.indexOf(item);
      if (draggedIdx < targetIdx) box.insertBefore(seqDragged, item.nextSibling);
      else box.insertBefore(seqDragged, item);
    }
  });
});
function checkSequence() {
  const items = [...document.querySelectorAll('#sequenceBox .sequence-item')];
  let correct = true;
  items.forEach((item, idx) => {
    if (parseInt(item.dataset.order) !== idx + 1) correct = false;
  });
  const r = document.getElementById('sequenceResult');
  if (correct) { r.textContent = '✓ ¡Secuencia correcta! Bien hecho.'; r.className = 'sequence-result show good'; }
  else { r.textContent = '✗ Aún no está en el orden correcto. Sigue intentando.'; r.className = 'sequence-result show bad'; }
}

// === CARGAR IFRAME (lazy: solo cuando se activa la pestaña) ===
function loadIframe(tabName) {
  if (loaded[tabName]) return;
  let src = document.getElementById('src-' + tabName).textContent;
  // Restaurar el placeholder XSCRIPT_CLOSE_TAG al cierre de script real
  src = src.split('XSCRIPT_CLOSE_TAG').join('<' + '/script>');

  frame.srcdoc = src;
  loaded[tabName] = true;
  // Después de que cargue, inyectar CSS para ocultar el navbar interno
  frame.addEventListener('load', function onLoad() {
    frame.removeEventListener('load', onLoad);
    hideInternalNav(frame);
    // La pestaña "ejemplos" necesita recoloración a púrpura (su contenido original es ámbar)
    if (tabName === 'ejemplos') {

}

// === INYECTAR CSS EN EL IFRAME PARA OCULTAR SU NAVBAR INTERNO ===
function hideInternalNav(frame) {
  try {
    const innerDoc = frame.contentDocument;
    if (!innerDoc) return;
    const style = innerDoc.createElement('style');
    style.id = 'hide-nav-injected';
    style.textContent = `
      .manual-nav, .nav { display: none !important; }
      html { scroll-padding-top: 10px !important; }
      body { padding-top: 0 !important; }
      .manual-container, .container { padding-top: 16px !important; }

    innerDoc.head.appendChild(style);
  } catch (e) {
    console.warn('No se pudo inyectar CSS en iframe:', e);
  }
}

// === INYECTAR TEMA PÚRPURA EN EL IFRAME DE EJEMPLOS ===
// El manual original está en ámbar; lo recoloreamos a púrpura para que coincida

      .hero .badge, .manual-header .badge-hero {
        background: linear-gradient(90deg, #a78bfa, #facc15) !important;
        color: #2e1065 !important;
      }
      .hero .meta span, .manual-header .meta span {

        background: var(--card-bg) !important;
        border-color: var(--card-border) !important;
      }
      .example-header {
        background: linear-gradient(180deg, #faf8ff, transparent) !important;
      }
      .example-header .num {
        background: linear-gradient(135deg, #7c3aed, #c4b5fd) !important;

      /* === DEMO FRAME (fondo punteado) === */
      .demo-frame {

      }
      .demo-frame .demo-label { color: #9f7aea !important; }

      /* === PROMPT BOX (gradiente ámbar → púrpura) === */
      .prompt-box {

      }
      .prompt-box::before { color: #a78bfa !important; }
      .prompt-box .prompt-tag {

      /* === FINAL FOOTER === */

      .back-to-top {

      /* === TOAST === */

      /* === COMPONENTES DE LOS DEMOS (recolorar a púrpura) === */
      .btn-primary { background: #7c3aed !important; box-shadow: 0 4px 6px -1px rgba(124, 58, 237, 0.3) !important; }
      .btn-primary:hover { background: #5b21b6 !important; }

      .btn-ghost { color: #7c3aed !important; }

// === EXTRAER ÍNDICE DE UN IFRAME (sus secciones) ===
function getSectionsFromIframe(tabName) {
  const frame = document.getElementById('frame-' + tabName);
  const innerDoc = frame.contentDocument;
  if (!innerDoc) return [];
  const sections = innerDoc.querySelectorAll('section[id]');
  const result = [];
  sections.forEach(sec => {
    const h2 = sec.querySelector('h2');
    if (h2) {
      // Limpiar el título (quitar badge si está dentro)
      const h2Clone = h2.cloneNode(true);
      h2Clone.querySelectorAll('.badge').forEach(b => b.remove());
      const title = h2Clone.textContent.replace(/\s+/g, ' ').trim();
      result.push({ id: sec.id, title: title.slice(0, 70) });
    }
  });
  return result;
}

// === ABRIR DRAWER ===
function openDrawer(tabName) {
  const colors = TAB_COLORS[tabName];
  // Header del drawer con el color del manual
  document.getElementById('drawerHeader').style.background = colors.accent;
  document.getElementById('drawerTitle').textContent = 'Índice · ' + colors.label.replace('Manual de Vibecoding · ', '').replace('Compendio de ', '');
  // Variables CSS del drawer para los enlaces
  document.getElementById('drawerPanel').style.setProperty('--drawer-accent', colors.accent);
  document.getElementById('drawerPanel').style.setProperty('--drawer-accent-deep', colors.accentDeep);
  document.getElementById('drawerPanel').style.setProperty('--drawer-accent-soft', colors.accentSoft);
  // Llenar el contenido con las secciones del manual
  const sections = getSectionsFromIframe(tabName);
  const content = document.getElementById('drawerContent');
  if (sections.length === 0) {
    content.innerHTML = '<p style="padding: 20px; color: #8a7d6e; font-size: 0.88rem; text-align: center;">El manual aún se está cargando. Vuelve a abrir el índice en un momento.</p>';
  } else {
    content.innerHTML = sections.map((s, i) => {
      // Para ejemplos, usar el número del ejemplo; para los demás, usar el orden
      const num = s.id.startsWith('ex') ? s.id.replace('ex', '') : (i + 1);
      return '<a class="drawer-link" onclick="goToSection(\'' + tabName + '\', \'' + s.id + '\')"><span class="link-num">' + num + '</span><span>' + s.title + '</span></a>';
    }).join('');
  }
  // Mostrar
  document.getElementById('drawerOverlay').classList.add('show');
  document.getElementById('drawerPanel').classList.add('show');
  document.body.style.overflow = 'hidden';
}

// === CERRAR DRAWER ===
function closeDrawer() {
  document.getElementById('drawerOverlay').classList.remove('show');
  document.getElementById('drawerPanel').classList.remove('show');
  document.body.style.overflow = '';
}

// === SALTAR A UNA SECCIÓN DENTRO DEL IFRAME ===
function goToSection(tabName, secId) {
  const frame = document.getElementById('frame-' + tabName);
  const innerDoc = frame.contentDocument;
  if (!innerDoc) return;
  const sec = innerDoc.getElementById(secId);
  if (sec) {
    sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  closeDrawer();
}

// === ACTIVAR PESTAÑA (cambia color + carga iframe + actualiza barra) ===
const tabButtons = document.querySelectorAll('.tab-btn');
const tabPanels = document.querySelectorAll('.tab-panel');
const tabBar = document.querySelector('.tab-bar');

function activateTab(tabName) {
  activeTab = tabName;
  tabButtons.forEach(b => {
    const active = b.dataset.tab === tabName;
    b.classList.toggle('active', active);
    b.setAttribute('aria-selected', active);
  });
  tabPanels.forEach(p => {
    p.classList.toggle('active', p.id === 'panel-' + tabName);
  });
  // Color de la barra de pestañas = color del manual activo
  tabBar.setAttribute('data-active', tabName);
  loadIframe(tabName);
  history.replaceState(null, '', '#' + tabName);
}

tabButtons.forEach(btn => {
  btn.addEventListener('click', () => activateTab(btn.dataset.tab));
});

// === PESTAÑA INICIAL (desde URL hash o default 'tech') ===
const initialTab = (location.hash.replace('#', '') in loaded) ? location.hash.replace('#', '') : 'tech';
activateTab(initialTab);

// === TECLADO: Alt+1/2/3 para cambiar pestaña, ESC cierra drawer ===
document.addEventListener('keydown', (e) => {
  if (e.altKey && (e.key === '1' || e.key === '2' || e.key === '3')) {
    e.preventDefault();
    const tabs = ['tech', 'pedagogia', 'ejemplos'];
    activateTab(tabs[parseInt(e.key) - 1]);
  }
  if (e.key === 'Escape') closeDrawer();
});

console.log('Compilación Integral · 3 manuales en 1 · cargada. Usa Alt+1/2/3 para pestañas, ESC para cerrar drawer.');
