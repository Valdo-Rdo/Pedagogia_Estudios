<section class="component-group" id="bd">
  <h2>💾 Bases de Datos Deep-Dive <span class="badge">SQL · NoSQL · Vectorial</span></h2>
  <p class="desc">
    <i class="fas fa-database"></i> Toda app real necesita persistencia. Elegir mal tu base de datos te persigue durante años. Aquí tienes las 4 familias que cubren el 99% de los casos. La IA domina los ORMs modernos (Prisma, Drizzle), pero tú debes decidir el modelo de datos correcto. Pregúntale: <code>"Para este caso de uso, ¿qué familia de BD recomiendas y por qué?"</code>.
  </p>

  <h3 class="sub-title"><i class="fas fa-table"></i> Las 4 familias</h3>
  <div class="ecosystem-grid">
    <div class="eco-card">
      <i class="fas fa-table icon-big" style="color:#336791;"></i>
      <h3>SQL Relacional <span class="tag">Estructurado</span></h3>
      <p><strong>PostgreSQL</strong>, MySQL, SQLite. Datos en tablas con esquema fijo. ACID: transacciones seguras. Ideal cuando tus datos tienen estructura clara y necesitas joins, foreign keys, reporting.</p>
      <span class="example-code">SELECT u.nombre, COUNT(o.id) FROM users u LEFT JOIN orders o ON o.user_id=u.id GROUP BY u.id;</span>
      <p class="use-case"><i class="fas fa-check-circle"></i> E-commerce, banking, ERP, CRM, cualquier app con datos estructurados.</p>
    </div>

    <div class="eco-card">
      <i class="fas fa-file-code icon-big" style="color:#47a248;"></i>
      <h3>NoSQL Documental <span class="tag">Flexible</span></h3>
      <p><strong>MongoDB</strong>, CouchDB. Datos en documentos JSON sin esquema fijo. Perfecto cuando los datos evolucionan rápido o varían entre registros. Sin joins costosos; denormalización intencional.</p>
      <span class="example-code">db.users.insertOne({ name: "Ana", tags: ["admin","vip"], meta: { any: "thing" } })</span>
      <p class="use-case"><i class="fas fa-check-circle"></i> CMS, content apps, prototipos rápidos, datos semiestructurados.</p>
    </div>

    <div class="eco-card">
      <i class="fas fa-bolt icon-big" style="color:#dc382d;"></i>
      <h3>NoSQL Clave-Valor <span class="tag">Cache &amp; speed</span></h3>
      <p><strong>Redis</strong>, Memcached, DynamoDB. Acceso en microsegundos. Ideal para caches, sesiones, colas, leaderboards, rate limiting. No para datos persistentes críticos (aunque Redis permite persistencia).</p>
      <span class="example-code">SET user:123 "{name:'Ana'}" EX 3600  # Cachea 1 hora</span>
      <p class="use-case"><i class="fas fa-check-circle"></i> Cache, sesiones, rate-limit, real-time counters, queues.</p>
    </div>

    <div class="eco-card">
      <i class="fas fa-vector-square icon-big" style="color:#6366f1;"></i>
      <h3>Vectorial <span class="tag">Para IA</span></h3>
      <p><strong>Pinecone</strong>, Qdrant, Weaviate, pgvector. Guarda embeddings (vectores numéricos) y busca por similitud semántica. La base de cualquier sistema RAG moderno.</p>
      <span class="example-code">pinecone.upsert([{ id:"doc1", values:[0.12,0.45,...], metadata:{...} }])</span>
      <p class="use-case"><i class="fas fa-check-circle"></i> Chatbots con documentos, búsqueda semántica, recomendaciones, RAG.</p>
    </div>
  </div>

  <h3 class="sub-title"><i class="fas fa-layer-group"></i> ORMs y capas de acceso</h3>
  <div class="tips-grid">
    <div class="tip-card" style="border-left-color:#2563eb;">
      <h4><i class="fas fa-cube"></i> Prisma</h4>
      <p>ORM TypeScript con schema declarativo. Tipado completo, migraciones automáticas. El favorito en el ecosistema Next.js.</p>
    </div>
    <div class="tip-card" style="border-left-color:#06b6d4;">
      <h4><i class="fas fa-cubes"></i> Drizzle</h4>
      <p>ORM TypeScript ligero, SQL-first. Más cercano al SQL real que Prisma. Subiendo fuerte en 2024-2025.</p>
    </div>
    <div class="tip-card" style="border-left-color:#10b981;">
      <h4><i class="fas fa-leaf"></i> SQLAlchemy</h4>
      <p>El ORM de Python. Maduro, flexible. SQLAlchemy 2.0 con tipado moderno. Base de FastAPI y Flask.</p>
    </div>
    <div class="tip-card" style="border-left-color:#f59e0b;">
      <h4><i class="fas fa-meteor"></i> Mongoose</h4>
      <p>ODM para MongoDB en Node.js. Schemas, validación, middleware. Sigue siendo estándar pese a la competencia.</p>
    </div>
  </div>

  <h3 class="sub-title"><i class="fas fa-cloud"></i> DBaaS (Database as a Service)</h3>
  <div style="overflow-x:auto;">
    <table class="data-table">
      <thead><tr><th>Servicio</th><th>Tipo</th><th>Plan gratis</th><th>Ideal para…</th></tr></thead>
      <tbody>
        <tr><td><strong>Supabase</strong></td><td>PostgreSQL + Auth + Storage + Realtime</td><td>Sí (generoso)</td><td>MVPs full-stack sin backend propio</td></tr>
        <tr><td><strong>Neon</strong></td><td>PostgreSQL serverless (branching)</td><td>Sí</td><td>Next.js + Prisma; branches por PR</td></tr>
        <tr><td><strong>PlanetScale</strong></td><td>MySQL serverless (Vitess)</td><td>No (free eliminado)</td><td>Apps MySQL a escala</td></tr>
        <tr><td><strong>Turso</strong></td><td>SQLite distribuido (libSQL)</td><td>Sí</td><td>Edge apps, low-latency global</td></tr>
        <tr><td><strong>MongoDB Atlas</strong></td><td>MongoDB hosted</td><td>Sí (512MB)</td><td>MongoDB sin ops</td></tr>
        <tr><td><strong>Firebase</strong></td><td>Firestore + Auth + Hosting</td><td>Sí (generoso)</td><td>Apps móviles y real-time</td></tr>
        <tr><td><strong>Upstash</strong></td><td>Redis serverless + Kafka</td><td>Sí (10k req/día)</td><td>Caches, rate-limit en edge</td></tr>
        <tr><td><strong>Pinecone</strong></td><td>Vectorial managed</td><td>Sí (starter)</td><td>RAG, búsqueda semántica</td></tr>
      </tbody>
    </table>
  </div>
</section>

<!-- SECCIÓN 9: GESTIÓN DE ESTADO                                    -->
<!-- ============================================================= -->
<section class="component-group" id="estado">
  <h2>🎭 Gestión de Estado en React <span class="badge">De useState a TanStack Query</span></h2>
  <p class="desc">
    <i class="fas fa-cubes"></i> Uno de los errores más comunes en vibecoding es sobre-ingeniar el estado. "Estado" significa dónde guardas los datos que cambian en tu UI. No siempre necesitas Redux. De hecho, casi nunca. Aquí tienes el árbol de decisión: empieza por lo simple y sube solo cuando lo necesites.
  </p>

  <div class="tips-grid">
    <div class="tip-card" style="border-left-color:#10b981;">
      <h4><i class="fas fa-1"></i> useState / useReducer</h4>
      <p>Para estado local de un componente (formulario abierto, contador, tab activo). No lo compartas fuera del componente.</p>
    </div>
    <div class="tip-card" style="border-left-color:#06b6d4;">
      <h4><i class="fas fa-2"></i> Context API</h4>
      <p>Para compartir estado entre varios componentes (tema, idioma, usuario logueado). Built-in, sin librerías. Cuidado: re-renders.</p>
    </div>
    <div class="tip-card" style="border-left-color:#2563eb;">
      <h4><i class="fas fa-3"></i> Zustand</h4>
      <p>Estado global ligero (~1KB) sin boilerplate. La alternativa moderna a Redux. Curva suave, performance brutal.</p>
    </div>
    <div class="tip-card" style="border-left-color:#8b5cf6;">
      <h4><i class="fas fa-4"></i> TanStack Query</h4>
      <p>NO es estado global: es estado del servidor (caché de fetches). Carga, refresca, sincroniza y cachea datos automáticamente. Hoy es el estándar.</p>
    </div>
    <div class="tip-card" style="border-left-color:#f59e0b;">
      <h4><i class="fas fa-5"></i> Redux Toolkit</h4>
      <p>Para apps grandes con lógica de estado compleja y muchos desarrolladores. Hoy rara vez es la mejor opción inicial.</p>
    </div>
    <div class="tip-card" style="border-left-color:#ef4444;">
      <h4><i class="fas fa-6"></i> Jotai / Valtio</h4>
      <p>Estado atómico: cada pieza de estado es independiente. Ideal para apps con estado muy granular (editores, canvas, herramientas).</p>
    </div>
  </div>

  <h3 class="sub-title"><i class="fas fa-circle-question"></i> ¿Cuál usar?</h3>
  <div class="prompt-block">
    <span class="prompt-tag">Pregunta para la IA</span><br>

<section class="component-group" id="estilos">
  <h2>🎨 Estilos y CSS Frameworks <span class="badge">Elige tu arma</span></h2>
  <p class="desc">
    <i class="fas fa-palette"></i> Hay 8 formas válidas de escribir CSS hoy. Cada una brilla en un contexto. La IA genera mejor código cuando le especificas el approach exacto. "Estiliza el componente" es ambiguo; "Estiliza con Tailwind, mobile-first, dark mode con clases <code>dark:</code>" es concrete y preciso.
  </p>

  <div class="ecosystem-grid">
    <div class="eco-card">
      <i class="fas fa-wind icon-big" style="color:#06b6d4;"></i>
      <h3>Tailwind CSS <span class="tag">Utility-first</span></h3>
      <p>Clases pequeñas (<code>p-4</code>, <code>text-lg</code>) que compones en el HTML. Sin escribir CSS. Curva inicial pero productividad brutal. El estándar de 2025.</p>
      <span class="example-code">&lt;button class="bg-blue-500 text-white px-4 py-2 rounded"&gt;OK&lt;/button&gt;</span>
      <p class="use-case"><i class="fas fa-check-circle"></i> Casi todo. Especialmente fuerte en equipos que iteran rápido.</p>
    </div>

    <div class="eco-card">
      <i class="fas fa-cube icon-big" style="color:#000;"></i>
      <h3>shadcn/ui <span class="tag">Copy-paste components</span></h3>
      <p>No es una librería: copias el código de los componentes a tu repo y los modificas. Construido sobre Radix + Tailwind. Trend #1 en 2024-2025.</p>
      <span class="example-code">npx shadcn@latest init  # Setup inicial</span>
      <p class="use-case"><i class="fas fa-check-circle"></i> React + Tailwind con componentes accesibles y customizables.</p>
    </div>

    <div class="eco-card">
      <i class="fas fa-paint-roller icon-big" style="color:#602b9d;"></i>
      <h3>Styled Components <span class="tag">CSS-in-JS</span></h3>
      <p>Escribes CSS real dentro de JS. Tema dinámico, sin colisiones de clases. Pierde performance vs Tailwind pero gana expresividad.</p>
      <span class="example-code">const Btn = styled.button`background: blue; padding: 8px;`;</span>
      <p class="use-case"><i class="fas fa-check-circle"></i> Apps con theming dinámico complejo y equipos que prefieren CSS real.</p>
    </div>

    <div class="eco-card">
      <i class="fas fa-cubes icon-big" style="color:#ffb300;"></i>
      <h3>CSS Modules <span class="tag">Escoping local</span></h3>
      <p>Archivos <code>.module.css</code>. Clases con scope local automático. Cero runtime. Built-in en Next.js, Vite.</p>
      <span class="example-code">import styles from './btn.module.css'; &lt;button className={styles.btn}&gt;</span>
      <p class="use-case"><i class="fas fa-check-circle"></i> Proyectos donde prefieres CSS clásico con aislamiento.</p>
    </div>

    <div class="eco-card">
      <i class="fas fa-mountain icon-big" style="color:#607d8b;"></i>
      <h3>Bootstrap 5 <span class="tag">El clásico</span></h3>
      <p>Componentes listos (cards, modals, navs) con clases semánticas (<code>btn btn-primary</code>). Sin instalar JS, solo CSS. Útil si heredas un proyecto Bootstrap o quieres algo sin curva.</p>
      <span class="example-code">&lt;button class="btn btn-primary"&gt;OK&lt;/button&gt;</span>
      <p class="use-case"><i class="fas fa-check-circle"></i> Prototipos rápidos, proyectos legacy, admin panels internos.</p>
    </div>

    <div class="eco-card">
      <i class="fas fa-mui icon-big" style="color:#007fff;"></i>
      <h3>Material UI <span class="tag">Material Design</span></h3>
      <p>Implementación de Material Design de Google. Componentes completos (DataTable, DatePickers, etc.). Pesado pero completo. Para dashboards empresariales.</p>
      <span class="example-code">import { Button } from '@mui/material';</span>
      <p class="use-case"><i class="fas fa-check-circle"></i> Dashboards B2B, admin panels, intranets con aspecto "Google-like".</p>
    </div>

    <div class="eco-card">
      <i class="fas fa-droplet icon-big" style="color:#38b2ac;"></i>
      <h3>Chakra UI <span class="tag">Composable</span></h3>
      <p>Componentes accesibles y themeables. API consistente. Menos popular que MUI pero muy querido por sus usuarios.</p>
      <span class="example-code">&lt;Button colorScheme="blue" size="md"&gt;OK&lt;/Button&gt;</span>
      <p class="use-case"><i class="fas fa-check-circle"></i> Proyectos React que priorizan accesibilidad y DX.</p>
    </div>

    <div class="eco-card">
      <i class="fas fa-seedling icon-big" style="color:#22c55e;"></i>
      <h3>PicoCSS / DaisyUI <span class="tag">Minimalista</span></h3>
      <p><strong>Pico</strong>: 10KB de CSS que se ve bien sin clases. <strong>DaisyUI</strong>: componentes Tailwind (<code>btn btn-primary</code>).</p>
      <span class="example-code">&lt;button class="btn btn-primary"&gt;OK&lt;/button&gt;  (DaisyUI)</span>
      <p class="use-case"><i class="fas fa-check-circle"></i> Pico para proyectos minimalistas; DaisyUI para Tailwind sin inventar clases.</p>
    </div>
  </div>
</section>

  <div class="prompt-block">

    <code>git init</code> &middot; <code>git add .</code> &middot; <code>git commit -m "mensaje"</code> &middot; <code>git push</code> &middot; <code>git pull</code> &middot; <code>git checkout -b feature</code> &middot; <code>git merge feature</code>
  </div>
  <p style="color:var(--text-soft); font-size:0.9rem; line-height:1.6; margin-bottom:16px;">

<script>
// === TEMA OSCURO ===
(function() {
  let saved = null;
  try { saved = localStorage.getItem('vibecoding-theme'); } catch(e) { saved = null; }
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  const toggle = document.getElementById('themeToggle');
  const icon = toggle.querySelector('i');
  function updateIcon() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
  }
  updateIcon();
  toggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (isDark) {
      document.documentElement.removeAttribute('data-theme');
      try { localStorage.setItem('vibecoding-theme', 'light'); } catch(e) {}
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      try { localStorage.setItem('vibecoding-theme', 'dark'); } catch(e) {}
    }
    updateIcon();
  });
})();

// === MENÚ MÓVIL ===
document.getElementById('menuToggle').addEventListener('click', function() {
  document.getElementById('navLinks').classList.toggle('show');
});

// === BARRA DE PROGRESO + ACTIVE NAV + BACK TO TOP ===
const progressBar = document.getElementById('progressBar');
const backToTop = document.getElementById('backToTop');
const navLinks = document.querySelectorAll('.nav-links a');
const sections = document.querySelectorAll('section[id]');

window.addEventListener('scroll', () => {
  const scrolled = window.scrollY;
  const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
  progressBar.style.width = (scrolled / totalHeight * 100) + '%';

  if (scrolled > 500) backToTop.classList.add('show');
  else backToTop.classList.remove('show');

  // Active nav
  let current = '';
  sections.forEach(sec => {
    if (scrolled >= sec.offsetTop - 120) current = sec.id;
  });
  navLinks.forEach(link => {
    link.classList.toggle('active', link.getAttribute('href') === '#' + current);
  });
});

backToTop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));

// === TABS ===
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(this.getAttribute('data-tab')).classList.add('active');
  });
});

// === ACORDEÓN ===
document.querySelectorAll('.accordion-header').forEach(header => {
  header.addEventListener('click', function() {
    const parent = this.parentElement;
    document.querySelectorAll('.accordion-item').forEach(item => { if (item !== parent) item.classList.remove('active'); });
    parent.classList.toggle('active');
  });
});

// === HAMBURGER ===
document.getElementById('hamburgerToggle').addEventListener('click', function(e) {
  e.stopPropagation();
  document.getElementById('hamburgerMenu').classList.toggle('show');
});
document.addEventListener('click', function(e) {
  const menu = document.getElementById('hamburgerMenu');
  const toggle = document.getElementById('hamburgerToggle');
  if (!menu.contains(e.target) && !toggle.contains(e.target)) menu.classList.remove('show');
});

// === DRAWER ===
function openDrawer() {
  document.getElementById('miDrawer').classList.add('show');
  document.getElementById('drawerOverlay').classList.add('show');
}
function closeDrawer() {
  document.getElementById('miDrawer').classList.remove('show');
  document.getElementById('drawerOverlay').classList.remove('show');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeDrawer();
    document.getElementById('miModal').classList.remove('show');
  }
});

// === TOAST ===
function showToast(message, type) {
  type = type || 'success';
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast';
  const icons = { success: 'fa-check-circle', info: 'fa-info-circle', error: 'fa-times-circle', warn: 'fa-exclamation-triangle' };
  const colors = { success: '#4ade80', info: '#38bdf8', error: '#f87171', warn: '#facc15' };
  t.innerHTML = '<i class="fas ' + (icons[type] || icons.success) + '" style="color:' + (colors[type] || colors.success) + ';"></i> ' + message + ' <button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>';
  c.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { if (t.parentNode) { t.classList.remove('show'); setTimeout(() => t.remove(), 400); } }, 3000);
}

// === COPIAR AL CLIPBOARD para CDN codes ===
document.querySelectorAll('.cdn-code').forEach(el => {
  el.addEventListener('click', function() {
    navigator.clipboard.writeText(this.innerText).then(() => showToast('CDN copiado al portapapeles'));
  });
});

// === BÚSQUEDA en nav (filtra secciones por texto) ===
const searchBox = document.getElementById('searchBox');
searchBox.addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll('section.component-group').forEach(sec => {
    if (!q) { sec.style.display = ''; return; }
    const text = sec.textContent.toLowerCase();
    sec.style.display = text.includes(q) ? '' : 'none';
  });
});

    <p class="sub"><i class="fas fa-lightbulb"></i> Aprende a diseñar recursos didácticos digitales con la IA como tu copiloto creativo: infografías, video-lecciones, rúbricas, actividades interactivas y objetos de aprendizaje. Una guía práctica, en español de LATAM, para futuros docentes que quieren enseñar mejor con tecnología — sin necesidad de ser programadores.</p>
    <div class="meta">
      <span><i class="fas fa-book-open-reader"></i> Para 1º a último semestre</span>

<section class="component-group highlight-orange" id="bienvenida">
  <h2>👋 Bienvenida, futura docente, futuro docente <span class="badge">Empecemos por el principio</span></h2>
  <p class="desc">
    <i class="fas fa-heart"></i> Este manual no asume que sepas programar. Tampoco asume que sepas pedagogía avanzada. Solo te pide una cosa: <strong>curiosidad por diseñar mejores experiencias de aprendizaje</strong>. La IA no viene a reemplazarte; viene a ser tu copiloto creativo, tu asistente incansable, el becario que nunca duerme. Tú aportas la intención pedagógica; la IA aporta la velocidad de producción. Juntos pueden hacer en una tarde lo que antes tomaba semanas. Si nunca has usado estas herramientas, no te preocupes: vamos paso a paso, con ejemplos reales del aula. Si ya las usas, vas a encontrar prompts y plantillas que multiplican tu productividad docente.
  </p>

  <h3 class="sub-title"><i class="fas fa-question-circle"></i> ¿Qué es "vibecoding pedagógico"?</h3>
  <p style="color:var(--text-soft); font-size:0.95rem; line-height:1.7; margin-bottom:16px;">
    <strong>Vibecoding</strong> originalmente significaba programar dirigiendo a la IA con lenguaje natural, en vez de escribir código a mano. Aquí lo adaptamos: <strong>vibecoding pedagógico</strong> es diseñar recursos didácticos digitales describiendo en lenguaje común lo que quieres lograr, y dejando que la IA genere el borrador que tú luego refinas con tu criterio profesional. Tú eres el director pedagógico; la IA es tu equipo de producción. La calidad final depende de dos cosas: qué tan claro expresas tu intención pedagógica, y qué tan bien evalúas y modificas lo que la IA te entrega. Este manual te ayuda con ambas.
  </p>

  <h3 class="sub-title"><i class="fas fa-route"></i> Cómo usar este manual</h3>
  <div class="tips-grid">
    <div class="tip-card" style="border-left-color:#16a34a;">
      <h4><i class="fas fa-leaf"></i> Si vas en 1º-2º semestre</h4>
      <p>Lee las secciones <strong>Inicio</strong>, <strong>Marco</strong>, <strong>IA Docente</strong> y <strong>Plantillas</strong>. Aún no necesitas el código ni el LMS. Concéntrate en entender el porqué y jugar con prompts.</p>
    </div>
    <div class="tip-card" style="border-left-color:#d97706;">
      <h4><i class="fas fa-seedling"></i> Si vas en 3º-5º semestre</h4>
      <p>Profundiza en <strong>Recursos</strong>, <strong>Actividades</strong>, <strong>Evaluación</strong>. Empieza a usar el <strong>Flujo</strong> para tus prácticas de aula. El HTML/CSS/JS queda opcional por ahora.</p>
    </div>
    <div class="tip-card" style="border-left-color:#c2410c;">
      <h4><i class="fas fa-tree"></i> Si vas en últimos semestres</h4>
      <p>Tócalo todo. Especialmente <strong>HTML/CSS/JS</strong> (para personalizar), <strong>LMS</strong> (para desplegar en práctica profesional) y <strong>Ética</strong> (para defender tu trabajo ante coordinadores).</p>
    </div>
    <div class="tip-card" style="border-left-color:#7c3aed;">
      <h4><i class="fas fa-magnifying-glass"></i> Si buscas algo puntual</h4>
      <p>Usa la <strong>barra de búsqueda</strong> arriba (filtra secciones al instante) o salta directo a las <strong>Plantillas</strong>: 30+ prompts listos para copiar y usar.</p>
    </div>
  </div>

  <h3 class="sub-title"><i class="fas fa-bullseye"></i> Lo que NO es este manual</h3>
  <div class="alert-box alert-warn"><i class="fas fa-circle-exclamation"></i><div><strong>No es un curso de programación.</strong> Aprendes HTML/CSS/JS básico solo para personalizar recursos, no para ser desarrolladora web.</div></div>
  <div class="alert-box alert-warn"><i class="fas fa-circle-exclamation"></i><div><strong>No reemplaza la didáctica.</strong> La IA genera el recurso; tú decides si es pedagógicamente válido. Sin marco teórico, la IA acelera errores.</div></div>
  <div class="alert-box alert-warn" style="margin-bottom:0;"><i class="fas fa-circle-exclamation"></i><div><strong>No es infalible.</strong> La IA inventa datos, plagia inadvertidamente y reproduce sesgos. La sección <strong>Ética</strong> es obligatoria.</div></div>
</section>


<section class="component-group" id="marco">
  <h2>📚 Marco Pedagógico-Tecnológico <span class="badge">TPACK · SAMR · Bloom · DUA</span></h2>
  <p class="desc">
    <i class="fas fa-book-open-reader"></i> Antes de abrir ChatGPT o Canva, necesitas saber <strong>por qué</strong> integras tecnología y <strong>cuándo</strong> conviene. Cuatro marcos te dan el mapa completo: <strong>TPACK</strong> (qué saberes cruzar), <strong>SAMR</strong> (en qué nivel integras), <strong>Bloom</strong> (qué cognición activas) y <strong>DUA</strong> (a quién incluyes). No son teoría decorativa: cada decisión de diseño debería pasar por estos 4 filtros. Si no puedes explicar tu recurso con estos 4 marcos, todavía no sabes por qué lo haces.
  </p>

  <h3 class="sub-title"><i class="fas fa-1"></i> TPACK: tres saberes que se cruzan</h3>
  <p style="color:var(--text-soft); font-size:0.95rem; line-height:1.7; margin-bottom:16px;">
    Mishra y Koehler (2006) propusieron que la buena enseñanza con tecnología nace de tres saberes que se cruzan. No basta con saber la materia, ni con saber pedagogía, ni con saber tecnología: el corazón útil es la <strong>intersección de los tres</strong> (TPACK). Cuando una de las tres falla, el recurso naufraga.
  </p>
  <div class="ecosystem-grid">
    <div class="eco-card">
      <i class="fas fa-flask icon-big" style="color:#0284c7;"></i>
      <h3>CK · Conocimiento del Contenido</h3>
      <p>¿Qué enseñas? Fracciones, fotosíntesis,Revolución Mexicana, análise sintática... Sin dominio del contenido, la IA puede darte resources con errores conceptuales que no detectarás.</p>
      <p class="use-case"><i class="fas fa-vial"></i> Antes de pedir a la IA un recurso sobre X, asegúrate de saber más de X que la IA.</p>
    </div>
    <div class="eco-card">
      <i class="fas fa-chalkboard-user icon-big" style="color:#16a34a;"></i>
      <h3>PK · Conocimiento Pedagógico</h3>
      <p>¿Cómo se enseña? Constructivismo, aprendizaje basado en proyectos, instrucción directa, andamiaje, evaluación formativa... Sin esto, "usas tecnología" pero no enseñas.</p>
      <p class="use-case"><i class="fas fa-vial"></i> Cada recurso debe tener un <strong>por qué pedagógico</strong>, no solo un "se ve bonito".</p>
    </div>
    <div class="eco-card">
      <i class="fas fa-laptop icon-big" style="color:#d97706;"></i>
      <h3>TK · Conocimiento Tecnológico</h3>
      <p>¿Qué herramienta? Canva, Genially, H5P, ChatGPT, etc. Sin esto, te quedas en lo que ya conoces y pierdes oportunidades. (Este manual te cubre esta parte.)</p>
      <p class="use-case"><i class="fas fa-vial"></i> Empieza con 3 herramientas, domínalas, luego añade más.</p>
    </div>
  </div>
  <div class="prompt-block">
    <span class="prompt-tag">Pregúntate antes de diseñar</span><br>
    "¿Qué contenido quiero que aprendan (<code>CK</code>), con qué estrategia pedagógica (<code>PK</code>), y qué herramienta lo potencia mejor (<code>TK</code>)?" Si no puedes responder las tres, detente y planifica primero.
  </div>

  <h3 class="sub-title"><i class="fas fa-2"></i> SAMR: ¿en qué nivel integras la tecnología?</h3>
  <p style="color:var(--text-soft); font-size:0.95rem; line-height:1.7; margin-bottom:16px;">
    Puentedura (2006) distingue 4 niveles de integración. Los dos primeros (<strong>Mejora</strong>) hacen lo mismo de antes pero más eficiente. Los dos últimos (<strong>Transformación</strong>) hacen cosas que sin tecnología serían imposibles. La IA te lleva rapidísimo al nivel <strong>Redefinición</strong> — pero solo si la guías bien.
  </p>
  <div class="tips-grid">
    <div class="samr-level" style="border-left-color:#94a3b8;">
      <span class="samr-tier">MEJORA · NIVEL 1</span>
      <h5>S · Sustitución</h5>
      <p>La tecnología reemplaza una herramienta analógica sin cambiar la tarea.</p>
      <div class="samr-example">PDF en lugar de fotocopias. Word en lugar de cuaderno. La tarea es la misma, solo cambió el soporte.</div>
    </div>
    <div class="samr-level" style="border-left-color:#0284c7;">
      <span class="samr-tier">MEJORA · NIVEL 2</span>
      <h5>A · Aumento</h5>
      <p>La tecnología reemplaza y además añade alguna mejora funcional.</p>
      <div class="samr-example">PDF con hipervínculos a videos. Word con corrector automático. El estudiante aprende igual, pero más eficiente.</div>
    </div>
    <div class="samr-level" style="border-left-color:#d97706;">
      <span class="samr-tier">TRANSFORMACIÓN · NIVEL 3</span>
      <h5>M · Modificación</h5>
      <p>La tecnología permite rediseñar la tarea. El estudiante aprende distinto.</p>
      <div class="samr-example">Foro asíncrono donde cada estudiante comenta y responde a 3 compañeros. Sin tecnología, no se podría hacer en clase presencial.</div>
    </div>
    <div class="samr-level" style="border-left-color:#c2410c;">
      <span class="samr-tier">TRANSFORMACIÓN · NIVEL 4</span>
      <h5>R · Redefinición</h5>
      <p>La tecnología permite tareas nuevas, imposibles sin ella.</p>
      <div class="samr-example">Estudiantes co-crean una wiki colaborativa con IA que sugiere fuentes, cita en APA y detecta plagio en tiempo real.</div>
    </div>
  </div>
  <div class="alert-box alert-info"><i class="fas fa-lightbulb"></i><div><strong>Trampa común:</strong> creer que "usar IA" automáticamente es Redefinición. Si solo le pides a ChatGPT que resuma un texto para los estudiantes, sigues en Sustitución. Redefinición es cuando la tarea misma cambia.</div></div>

  <h3 class="sub-title"><i class="fas fa-3"></i> Bloom revisada: ¿qué cognición activas?</h3>
  <p style="color:var(--text-soft); font-size:0.95rem; line-height:1.7; margin-bottom:16px;">
    Anderson y Krathwohl (2001) revisaron la taxonomía de Bloom original. La nueva versión usa verbos y reordena el nivel superior: <strong>Crear</strong> queda en la cúspide. Cada recurso didáctico apunta a un nivel. La IA puede generar resources para todos los niveles, pero <strong>tú decides</strong> cuál activas. Un examen de opción múltiple apunta a Recordar; una infografía que el estudiante diseña con IA apunta a Crear.
  </p>
  <div class="ecosystem-grid">
    <div class="bloom-level"><h5>1. Recordar</h5><p>Definir, listar, nombrar. Ej: <em>"¿Cuál es la capital de Brasil?"</em></p></div>
    <div class="bloom-level"><h5>2. Comprender</h5><p>Resumir, explicar, clasificar. Ej: <em>"Explica con tus palabras qué es la fotosíntesis"</em></p></div>
    <div class="bloom-level"><h5>3. Aplicar</h5><p>Usar, calcular, demostrar. Ej: <em>"Calcula el área de este triángulo"</em></p></div>
    <div class="bloom-level"><h5>4. Analizar</h5><p>Comparar, contrastar, descomponer. Ej: <em>"Compara las causas de la Independencia y la Revolución"</em></p></div>
    <div class="bloom-level"><h5>5. Evaluar</h5><p>Juzgar, criticar, justificar. Ej: <em>"Argumenta si esta fuente es confiable para una investigación"</em></p></div>
    <div class="bloom-level"><h5>6. Crear</h5><p>Diseñar, generar, producir. Ej: <em>"Diseña una campaña sobre salud mental para tu escuela"</em></p></div>
  </div>
  <div class="prompt-block">
    <span class="prompt-tag">Pregúntale a la IA antes de diseñar</span><br>
    "Voy a diseñar un recurso didáctico sobre <code>TEMA</code> para estudiantes de <code>NIVEL/GRADO</code>. Mi objetivo de aprendizaje apunta al nivel de Bloom <code>NIVEL</code>. Propón 3 actividades distintas que efectivamente activen ese nivel cognitivo, no niveles inferiores. Justifica por qué cada una cumple."
  </div>

  <h3 class="sub-title"><i class="fas fa-4"></i> DUA: Diseño Universal de Aprendizaje</h3>
  <p style="color:var(--text-soft); font-size:0.95rem; line-height:1.7; margin-bottom:16px;">
    CAST (Center for Applied Special Technology) propone el DUA como marco para diseñar recursos accesibles a <strong>todos</strong> los estudiantes desde el inicio, no como adaptación posterior. Tres principios: <strong>múltiples formas de representación</strong> (cómo se presenta el contenido), <strong>múltiples formas de acción y expresión</strong> (cómo el estudiante demuestra lo aprendido), y <strong>múltiples formas de implicación</strong> (cómo se involucra al estudiante). La IA te ayuda a generar variantes de un mismo contenido en distintos formatos: la misma idea como texto, audio, infografía y video.
  </p>
  <div class="tips-grid">
    <div class="tip-card" style="border-left-color:#0284c7;">
      <h4><i class="fas fa-eye"></i> Representación</h4>
      <p>Mismo contenido en texto, audio, video, infografía, mapa mental. La IA te genera todas las versiones en minutos.</p>
    </div>
    <div class="tip-card" style="border-left-color:#16a34a;">
      <h4><i class="fas fa-pen-fancy"></i> Acción y expresión</h4>
      <p>El estudiante puede demostrar aprendizaje con ensayo, podcast, video, mapa mental, presentación oral. Ofrece opciones, no impongas una sola vía.</p>
    </div>
    <div class="tip-card" style="border-left-color:#d97706;">
      <h4><i class="fas fa-heart"></i> Implicación</h4>
      <p>Ofrece retos con autonomía, relevancia para la vida real, y feedback frecuente. La IA puede generar 10 variantes de un mismo reto para distintos intereses.</p>
    </div>
  </div>
  <div class="alert-box alert-success"><i class="fas fa-circle-check"></i><div><strong>Check DUA rápido:</strong> ¿Tu recurso ofrece el contenido en al menos 2 formatos? ¿Permite al estudiante demostrar aprendizaje en al menos 2 formas? ¿Conecta con intereses diversos? Si puedes responder "sí" a las tres, vas bien.</div></div>
</section>


<section class="component-group" id="ecosistema">
  <h2>🧰 Ecosistema de Herramientas <span class="badge">Qué usar para qué</span></h2>
  <p class="desc">
    <i class="fas fa-toolbox"></i> Hay 4 grandes familias de herramientas que conviven en tu práctica docente. Saber a qué familia pertenece cada una evita el error más común: usar la herramienta equivocada para el objetivo pedagógico. La IA no reemplaza a Canva ni a Genially; cada familia resuelve problemas distintos. Una infografía se hace en Canva, una actividad interactiva en Genially, una pregunta reflexiva en ChatGPT y se despliega en Classroom. Este mapa mental es la base de todo lo que sigue en el manual.
  </p>

  <div class="ecosystem-grid">
    <div class="eco-card">
      <i class="fas fa-robot icon-big" style="color:#7c3aed;"></i>
      <h3>IA Generativa <span class="tag">Tu copiloto</span></h3>
      <p>ChatGPT, Claude, Gemini, MagicSchool, Khanmigo, Curipod. Generan texto, ideas, rúbricas, prompts, planes de clase. <strong>No producen el recurso final visual</strong>; producen el contenido y la estructura que luego pones en las otras herramientas.</p>
      <p class="use-case"><i class="fas fa-check"></i> Úsala para planificar, redactar, generar variantes, retroalimentar borradores.</p>
    </div>

    <div class="eco-card">
      <i class="fas fa-palette icon-big" style="color:#c2410c;"></i>
      <h3>Diseño Visual <span class="tag">Canva + co.</span></h3>
      <p>Canva, Genially, Gamma, Piktochart, Visme, Adobe Express. Templates listos, drag-and-drop, exportan a PDF/PNG/link. Aquí nacen las infografías y presentaciones con calidad profesional sin ser diseñadora.</p>
      <p class="use-case"><i class="fas fa-check"></i> Úsalas para recursos visuales estáticos o con animaciones simples: infografías, posters, presentaciones.</p>
    </div>

    <div class="eco-card">
      <i class="fas fa-puzzle-piece icon-big" style="color:#16a34a;"></i>

<section class="component-group" id="prompting">
  <h2>🎯 Maestría en Prompts Pedagógicos <span class="badge">Habla como docente senior</span></h2>
  <p class="desc">
    <i class="fas fa-comment-dots"></i> Un prompt es la instrucción que le das a la IA. La diferencia entre un prompt mediocre y uno excelente es brutal: el malo te da un plan de clase genérico que no aplica a tu grupo; el bueno te da un recurso específico, alineado con tu marco teórico y listo para refinar. Aquí vas a aprender los patrones que separan a un docente junior que usa IA de un docente senior. No son recetas mágicas, son técnicas reproducibles. Una vez interiorizadas, vas a escribir prompts 5x mejores en menos de un mes. Y vas a distinguir cuándo la IA te está dando algo válido de cuando está alucinando.
  </p>

  <h3 class="sub-title"><i class="fas fa-1"></i> Los 5 C's del prompting docente</h3>
  <div class="tips-grid">
    <div class="tip-card" style="border-left-color:#c2410c;">
      <h4><i class="fas fa-bullseye"></i> Clear (Claro)</h4>
      <p>Una petición por mensaje. Si pides "plan de clase + rúbrica + actividad", la IA hará las 3 a medias. Una tarea por prompt.</p>
    </div>
    <div class="tip-card" style="border-left-color:#7c3aed;">
      <h4><i class="fas fa-school"></i> Context (Contexto)</h4>
      <p>Nivel, grado, materia, marco curricular (CCB, BNCC, SEP), momento del curso, perfil del grupo. Sin contexto, la IA adivina.</p>
    </div>
    <div class="tip-card" style="border-left-color:#16a34a;">
      <h4><i class="fas fa-ban"></i> Constraints (Restricciones)</h4>
      <p>"No uses términos técnicos", "Máximo 200 palabras", "Solo en preguntas abiertas". Las prohibiciones mejoran más que las exigencias.</p>
    </div>
    <div class="tip-card" style="border-left-color:#d97706;">
      <h4><i class="fas fa-list"></i> Examples (Ejemplos)</h4>
      <p>Mostrar el formato esperado con 1-2 ejemplos ("few-shot") multiplica la precisión. Pega una rúbrica buena y dile "como esta".</p>
    </div>
    <div class="tip-card" style="border-left-color:#dc2626;">
      <h4><i class="fas fa-magnifying-glass"></i> Critique (Crítica)</h4>
      <p>Pídele a la IA que revise su propia respuesta: "Revisa este plan por sesgos, alineación con el objetivo y factibilidad en 50 min".</p>
    </div>
  </div>

  <h3 class="sub-title"><i class="fas fa-2"></i> Patrones específicos para docentes</h3>
  <div class="tips-grid">
    <div class="tip-card" style="border-left-color:#c2410c;">
      <h4><i class="fas fa-user-tie"></i> Persona pattern</h4>
      <p>Empieza con <code>"Actúa como docente con 15 años de experiencia en secundaria, especialista en evaluación formativa..."</code></p>
    </div>
    <div class="tip-card" style="border-left-color:#7c3aed;">
      <h4><i class="fas fa-list-ol"></i> Few-shot</h4>
      <p>Pega 2 ejemplos de buenos planes antes de pedir el tercero. La IA calibra tono y nivel de detalle.</p>
    </div>
    <div class="tip-card" style="border-left-color:#16a34a;">
      <h4><i class="fas fa-link"></i> Chain-of-thought</h4>
      <p><code>"Antes de darme el plan, analiza: 1) preconcepciones erróneas, 2) prerrequisitos, 3) dificultades esperadas. Luego planifica."</code></p>
    </div>
    <div class="tip-card" style="border-left-color:#d97706;">
      <h4><i class="fas fa-arrows-rotate"></i> Iterative refinement</h4>
      <p>No aceptes la primera respuesta. Pide "ahora simplifica", "ahora hazlo más interactivo", "ahora añade diferenciación DUA".</p>
    </div>
    <div class="tip-card" style="border-left-color:#dc2626;">
      <h4><i class="fas fa-shield-halved"></i> Constraint pattern</h4>
      <p><code>"No inventes datos. Si no estás seguro, dilo. No uses lenguaje discriminatorio. Cita autores solo si los conoces."</code></p>
    </div>
    <div class="tip-card" style="border-left-color:#0284c7;">
      <h4><i class="fas fa-scissors"></i> Decomposition</h4>
      <p>Divide un plan grande en 3 prompts: 1) objetivo + secuencia, 2) actividad central, 3) evaluación. Cada uno enfocado.</p>
    </div>
  </div>

  <h3 class="sub-title"><i class="fas fa-3"></i> Mal prompt vs Buen prompt (con ejemplos de aula)</h3>
  <div class="compare-grid">
    <div class="compare-card bad">
      <h5><i class="fas fa-times-circle"></i> Mal prompt</h5>
      <p>"Hazme un plan de clase sobre fotosíntesis"</p>
    </div>
    <div class="compare-card good">
      <h5><i class="fas fa-check-circle"></i> Buen prompt</h5>
      <p>"Actúa como docente de biología con 10 años en secundaria. Crea un plan de 45 min sobre fotosíntesis para 1º de secundaria, alineado con el aprendizaje esperado del CCB. Incluye: objetivo enunciable en una frase, apertura con pregunta detonadora (5 min), desarrollo con actividad de modelado (30 min), cierre con ticket de salida (10 min). Diferenciación DUA para 2 estudiantes con TDAH. Materiales accesibles en aula pública mexicana."</p>
    </div>
  </div>
  <div class="compare-grid" style="margin-top:12px;">
    <div class="compare-card bad">
      <h5><i class="fas fa-times-circle"></i> Mal prompt</h5>
      <p>"Dame una rúbrica para ensayos"</p>
    </div>
    <div class="compare-card good">
      <h5><i class="fas fa-check-circle"></i> Buen prompt</h5>
      <p>"Diseña una rúbrica analítica (4 niveles: Inicial, En desarrollo, Logrado, Sobresaliente) y 5 criterios para evaluar un ensayo argumentativo de 800 palabras de bachillerato. Criterios: tesis, evidencias, estructura, contrargumentación, registro académico. Pesos: tesis 25%, evidencias 30%, estructura 15%, contraargumentación 20%, registro 10%. Describe cada nivel con descriptors observables, no juicios vagos. Formato tabla markdown."</p>
    </div>
  </div>

  <h3 class="sub-title"><i class="fas fa-4"></i> Anti-patrones a evitar</h3>
  <div class="tips-grid">
    <div class="tip-card" style="border-left-color:#dc2626;">
      <h4><i class="fas fa-triangle-exclamation"></i> "Hazlo lo mejor posible"</h4>
      <p>La IA no sabe qué es "lo mejor" en pedagogía. Específica: "más interactivo", "más andamiado", "más diferenciado".</p>
    </div>
    <div class="tip-card" style="border-left-color:#dc2626;">
      <h4><i class="fas fa-triangle-exclamation"></i> Pedir 10 recursos a la vez</h4>
      <p>Cuantas más tareas en un prompt, peor calidad en cada una. Un recurso = un prompt. Itera.</p>
    </div>
    <div class="tip-card" style="border-left-color:#dc2626;">
      <h4><i class="fas fa-triangle-exclamation"></i> No especificar nivel/edad</h4>
      <p>"Para secundaria" puede dar contenido para 1º o 3º. Especifica grado exacto y edad.</p>
    </div>
    <div class="tip-card" style="border-left-color:#dc2626;">
      <h4><i class="fas fa-triangle-exclamation"></i> Aceptar ciegamente</h4>
      <p>La IA inventa autores, fechas y currículos. Verifica cada dato antes de usarlo con tus estudiantes.</p>
    </div>
  </div>

  <h3 class="sub-title"><i class="fas fa-5"></i> Plantillas maestras (la versión completa está en sección Plantillas)</h3>
  <div class="prompt-block">
    <span class="prompt-tag">Plantilla · Plan de clase</span><br>
    "Actúa como docente con experiencia en <code>NIVEL</code>. Crea un plan de <code>DURACIÓN</code> min sobre <code>TEMA</code> para <code>GRADO</code>, alineado con <code>MARCO_CURRICULAR</code>. Incluye: objetivo, apertura (<code>X</code> min), desarrollo (<code>Y</code> min), cierre (<code>Z</code> min), evaluación formativa. Diferenciación DUA para <code>NEE</code>. Materiales accesibles en <code>CONTEXTO</code>."
  </div>
  <div class="prompt-block">
    <span class="prompt-tag">Plantilla · Rúbrica analítica</span><br>
    "Diseña una rúbrica analítica de 4 niveles (Inicial, En desarrollo, Logrado, Sobresaliente) y <code>N</code> criterios para evaluar <code>PRODUCTO</code> de <code>NIVEL</code>. Criterios: <code>LISTA</code>. Pesos: <code>DISTRIBUCIÓN</code>. Descriptores observables, no juicios vagos. Formato tabla markdown. Incluye 1 ejemplo de descriptor sobresaliente."
  </div>
</section>


<section class="component-group" id="workflow">
  <h2>🔄 Flujo de Trabajo Docente con IA <span class="badge">De objetivo a recurso publicado</span></h2>
  <p class="desc">
    <i class="fas fa-route"></i> Diseñar un recurso didáctico con IA no es "tirar prompts hasta que algo funcione". Es un flujo iterativo de 8 pasos que combina claridad pedagógica, producción acelerada y validación crítica. Saltarte pasos te cuesta horas de rework. Seguirlos te da recursos listos para el aula en una tarde, no en una semana. Este es el flujo que usan docentes productivos con IA; cópialo, adáptalo a tu ritmo y verás resultados desde la primera semana. Especialmente el paso 8: sin validación humana, todo lo anterior puede reproducir sesgos o errores en tus estudiantes.
  </p>

  <div class="workflow-steps">
    <div class="workflow-step">
      <div class="step-num">1</div>
      <div>
        <h4>Definir el objetivo de aprendizaje (en una frase)</h4>
        <p>Antes de abrir ChatGPT, escribe qué debería poder hacer el estudiante al final. Si no puedes resumirlo en 25 palabras, todavía no sabes qué quieres enseñar. La IA amplifica la confusión tanto como la claridad. Define objetivo en términos de desempeño observable, no de contenido: "el estudiante <strong>argumentará</strong>" no "el estudiante <strong>conocerá</strong>".</p>
        <div class="prompt-block"><span class="prompt-tag">Paso 1</span> "Mi objetivo de aprendizaje para esta sesión es: el estudiante de <code>GRADO</code> será capaz de <code>VERBO_BLOOM</code> <code>CONTENIDO</code> en <code>CONTEXTO</code>. ¿Es observable, medible y apropiado para el nivel? Mejóralo si es necesario."</div>
      </div>
    </div>

    <div class="workflow-step">
      <div class="step-num">2</div>
      <div>
        <h4>Elegir el marco pedagógico (TPACK + SAMR + Bloom + DUA)</h4>
        <p>Decide en qué nivel SAMR quieres operar, qué nivel de Bloom activar, y cómo vas a aplicar DUA. Estos 3 filtros determinan el tipo de recurso. Si solo quieres sustituir (SAMR nivel S), un PDF basta. Si quieres redefinir (SAMR nivel R), necesitas una herramienta interactiva con IA integrada. No diseñes ciego.</p>
        <div class="prompt-block"><span class="prompt-tag">Paso 2</span> "Para este objetivo <code>OBJETIVO</code> en <code>GRADO</code>, propón 2 opciones de recurso: una en nivel SAMR <strong>Modificación</strong> y otra en <strong>Redefinición</strong>. Para cada una, indica nivel de Bloom activo, herramientas, y cómo aplica DUA en sus 3 principios."</div>
      </div>
    </div>

    <div class="workflow-step">
      <div class="step-num">3</div>
      <div>
        <h4>Generar el contenido base con IA</h4>
        <p>Pídele a la IA el contenido estructurado: objetivo, secuencia, textos clave, preguntas, errores comunes. No le pidas todavía el recurso visual; primero ten el contenido pedagógico claro. Trabaja en un chat nuevo para no arrastrar contextos anteriores. Si te da algo erróneo, no lo corrijas tú: pídele que se corrija a sí misma.</p>
        <div class="prompt-block"><span class="prompt-tag">Paso 3</span> "Genera el contenido pedagógico (no el diseño visual) para <code>OBJETIVO</code>. Incluye: 3 ideas previas erróneas comunes, 2 preguntas detonadoras, 4 conceptos clave con definición de una línea, 2 ejemplos cotidianos, 1 mini-reto final. Sin introducciones ni cortesías."</div>
      </div>
    </div>

    <div class="workflow-step">
      <div class="step-num">4</div>
      <div>
        <h4>Producción visual con herramientas no-code</h4>
        <p>Con el contenido listo, muévelo a Canva / Genially / Gamma / H5P según el tipo de recurso. Usa una plantilla como base, no empieces de cero. Pega el contenido generado. Ajusta colores (asegúrate de tener contraste), fuentes (legibles), y disposición. La IA generó el qué; ahora tú decides el cómo visual.</p>
        <div class="prompt-block"><span class="prompt-tag">Paso 4</span> "Recomiéndame una plantilla de <code>HERRAMIENTA</code> para este contenido: <code>TIPO_RECURSO</code>. Describe el layout (dónde van títulos, dónde texto, dónde imágenes). Da paleta de colores accesible (contraste AA) y 2 fuentes legibles."</div>
      </div>
    </div>

    <div class="workflow-step">
      <div class="step-num">5</div>
      <div>
        <h4>Iterar con feedback específico</h4>
        <p>Cuando algo no te gusta, descríbelo en términos de comportamiento observable, no de solución. "El estudiante podría confundirse en la transición entre diapositivas 4 y 5" es mejor que "hazlo mejor". La IA encuentra el cómo si le das el qué. Y no temas regresar al chat del paso 3: una y otra vez.</p>
        <div class="prompt-block"><span class="prompt-tag">Paso 5</span> "Tengo este contenido: <code>PEGAR</code>. Mi preocupación es que <code>PROBLEMA_PEDAGÓGICO</code>. Propón 2 formas de resolverlo sin cambiar el objetivo. Una mínima, una más ambiciosa. Justifica pedagógicamente cada opción."</div>
      </div>
    </div>

    <div class="workflow-step">
      <div class="step-num">6</div>
      <div>
        <h4>Validar con colegas y contra marco teórico</h4>
        <p>Antes de llevarlo al aula, muéstralo a un colega (idealmente de otra especialidad) y pídele que actúe como "abogado del diablo". ¿El recurso realmente activa el nivel de Bloom que dijiste? ¿La diferenciación DUA es genuina o cosmética? ¿Hay datos que la IA inventó sin que te dieras cuenta? Mejor detectar errores aquí que en clase.</p>
        <div class="prompt-block"><span class="prompt-tag">Paso 6</span> "Actúa como coordinador académico crítico. Revisa este recurso <code>PEGAR_RECURSO</code> contra estos 4 criterios: 1) alineación con objetivo, 2) coherencia con nivel Bloom declarado, 3) aplicación real de DUA (no cosmética), 4) posibles sesgos o errores de contenido. Lista problemas y propón fix para cada uno."</div>
      </div>
    </div>

    <div class="workflow-step">
      <div class="step-num">7</div>
      <div>
        <h4>Publicar en el LMS de tu institución</h4>
        <p>El recurso no existe si solo está en tu computadora. Súbelo a tu LMS (Moodle, Classroom, Canvas, Teams) en una sección claramente etiquetada. Acompaña el recurso con: instrucciones para el estudiante, tiempo estimado, criterios de éxito, y cómo pedir ayuda. Sin andamiaje de uso, el mejor recurso falla.</p>
        <div class="prompt-block"><span class="prompt-tag">Paso 7</span> "Escribe el texto que acompañará al recurso en mi <code>LMS</code>. Incluye: instrucciones para el estudiante (qué hacer, en qué orden, cuánto tiempo), criterios de éxito en 3 puntos, y qué hacer si se atoran. Tono cercano, no burocrático."</div>
      </div>
    </div>

    <div class="workflow-step">
      <div class="step-num">8</div>
      <div>
        <h4>Iterar basándote en lo que pasó en clase</h4>
        <p>Después de usar el recurso, anota 3 cosas: qué funcionó, qué no, qué ajustas. Vuelve al paso 1 para el siguiente recurso con esta información. Vibecoding pedagógico es un loop: objetivo → recurso → uso real → ajuste → nuevo objetivo. No es una carrera de un sprint. Guarda tus prompts ganadores en una libreta de prompts personal.</p>
        <div class="prompt-block"><span class="prompt-tag">Paso 8</span> "Después de usar el recurso en clase, observé: <code>OBSERVACIONES</code>. Para mi próximo recurso sobre <code>TEMA_SIGUIENTE</code>, ¿qué debo mantener, qué debo cambiar, qué debo dejar de hacer? Da 3 recomendaciones específicas basadas en estas observaciones."</div>
      </div>
    </div>
  </div>
</section>


<section class="component-group highlight-orange" id="recursos">
  <h2>📦 Catálogo de Recursos Didácticos <span class="badge">Qué hacer y con qué</span></h2>
  <p class="desc">
    <i class="fas fa-layer-group"></i> Aquí tienes el corazón del manual: 6 familias de recursos didácticos digitales con sus herramientas ideales, prompts y criterios pedagógicos. No las uses todas a la vez: domina 2, añade otra cuando ya te aburras de la primera. La variedad de recursos en un curso debe servir a la variedad de momentos pedagógicos, no a tu ego de "docente tech". Cada familia tiene su propia lógica, su propio nivel SAMR típico y su propio nivel de Bloom que mejor activa. Elige la familia según el objetivo, no según el cape.
  </p>

  <div class="ecosystem-grid">
    <div class="eco-card">
      <i class="fas fa-chart-column icon-big" style="color:#c2410c;"></i>
      <h3>Infografías <span class="tag">Visual estático</span></h3>
      <p>Sintetizan información compleja en un formato visual compacto. Excelentes para introducir un tema, resumir al cierre, o como material de estudio. SAMR: Aumento/Modificación. Bloom: Comprender, Sintetizar.</p>
      <span class="example-code">Herramientas: Canva, Genially, Piktochart, Visme, Adobe Express</span>
      <p class="use-case"><i class="fas fa-check"></i> Prompts: <code>"Genera el contenido de una infografía de 5 secciones sobre [TEMA] para [GRADO]: título, dato impactante, 4 subtemas con 2-3 bullets, dato final."</code></p>
    </div>

    <div class="eco-card">
      <i class="fas fa-display icon-big" style="color:#7c3aed;"></i>
      <h3>Presentaciones <span class="tag">Clase magistral</span></h3>
      <p>Soporte visual para tu exposición. SAMR: Sustitución (si solo reemplaza pizarra) hasta Modificación (si incluye interacción). Bloom: Comprender, Analizar. Cuidado: no son sustituto de tu clase.</p>
      <span class="example-code">Herramientas: Canva, Gamma, Genially, PowerPoint, Google Slides</span>
      <p class="use-case"><i class="fas fa-check"></i> Prompts: <code>"Estructura una presentación de [N] diapositivas sobre [TEMA] para [GRADO]. 1 idea por diapositiva, sin párrafos largos, con pregunta de discusión al final."</code></p>
    </div>

    <div class="eco-card">
      <i class="fas fa-video icon-big" style="color:#dc2626;"></i>
      <h3>Video-lecciones <span class="tag">Flipped classroom</span></h3>
      <p>El estudiante ve el video antes de clase; el tiempo presencial se usa para aplicación. SAMR: Modificación/Redefinición. Bloom: Comprender (en casa), Aplicar/Analizar (en clase). Ideal para temas procedimentales.</p>
      <span class="example-code">Herramientas: Synthesia, HeyGen, Loom, CapCut, Screencastify</span>
      <p class="use-case"><i class="fas fa-check"></i> Prompts: <code>"Escribe el guion (máx 3 min) para un video sobre [TEMA] para [GRADO]. Empieza con problema cotidiano, desarrolla procedimiento, cierra con mini-reto."</code></p>
    </div>

    <div class="eco-card">
      <i class="fas fa-puzzle-piece icon-big" style="color:#16a34a;"></i>
      <h3>Actividades interactivas <span class="tag">Quiz + drag + match</span></h3>
      <p>El estudiante responde, arrastra, completa. Feedback inmediato. SAMR: Modificación/Redefinición. Bloom: Aplicar, Analizar. Perfectas para evaluación formativa y gamificación.</p>
      <span class="example-code">Herramientas: Mentimeter, Kahoot, Quizizz, Wordwall, Educaplay, Curipod</span>
      <p class="use-case"><i class="fas fa-check"></i> Prompts: <code>"Genera 10 preguntas de opción múltiple sobre [TEMA] para [GRADO] con 4 opciones y clave. Nivel Bloom: [NIVEL]. Incluye 2 distractores plausibles."</code></p>
    </div>

    <div class="eco-card">
      <i class="fas fa-cubes icon-big" style="color:#0284c7;"></i>
      <h3>Objetos de aprendizaje (OCW) <span class="tag">Autocontenido</span></h3>
      <p>Recurso completo y reutilizable: objetivo + contenido + actividad + autoevaluación. SAMR: Redefinición. Bloom: varios. Estándar SCORM para integrarse en LMS. Mayor inversión, mayor retorno.</p>
      <span class="example-code">Herramientas: H5P, Genially, ExeLearning, LearningApps</span>
      <p class="use-case"><i class="fas fa-check"></i> Prompts: <code>"Estructura un objeto de aprendizaje sobre [TEMA]: objetivo, contenido (300 palabras), actividad interactiva, autoevaluación de 5 preguntas. Sigue estándar SCORM."</code></p>
    </div>

    <div class="eco-card">
      <i class="fas fa-trophy icon-big" style="color:#d97706;"></i>
      <h3>Gamificación <span class="tag">Role-play y quiz</span></h3>
      <p>Mecánicas de juego (puntos, retos, niveles) aplicadas al aprendizaje. SAMR: Modificación/Redefinición. Bloom: Aplicar, Crear. Enganche alto; riesgo de confundir gamificación con "jugar por jugar".</p>
      <span class="example-code">Herramientas: Kahoot, Quizizz, Wordwall, Genially, ClassDojo</span>
      <p class="use-case"><i class="fas fa-check"></i> Prompts: <code>"Diseña una actividad gamificada de [NIVEL] sobre [TEMA]: 5 retos progresivos, puntos por reto, bonus final, instrucciones claras. Sin distraer del objetivo pedagógico."</code></p>
    </div>
  </div>

  <h3 class="sub-title"><i class="fas fa-circle-check"></i> Criterios pedagógicos para evaluar un recurso (antes de usarlo en clase)</h3>
  <div class="tips-grid">
    <div class="tip-card" style="border-left-color:#c2410c;">
      <h4><i class="fas fa-1"></i> Alineación con objetivo</h4>
      <p>¿El recurso realmente ayuda a alcanzar el objetivo declarado, o es "bonito pero irrelevante"? Si lo quitas, ¿el objetivo se sigue cumpliendo?</p>
    </div>
    <div class="tip-card" style="border-left-color:#7c3aed;">
      <h4><i class="fas fa-2"></i> Nivel Bloom coherente</h4>
      <p>Si tu objetivo es "Analizar" pero el recurso solo pide "Recordar", no sirve. El recurso debe activar el nivel cognitivo declarado.</p>
    </div>
    <div class="tip-card" style="border-left-color:#16a34a;">
      <h4><i class="fas fa-3"></i> DUA real (no cosmética)</h4>
      <p>¿El recurso ofrece 2+ formatos de representación? ¿Permite 2+ formas de demostrar aprendizaje? ¿Engancha intereses diversos?</p>
    </div>
    <div class="tip-card" style="border-left-color:#d97706;">
      <h4><i class="fas fa-4"></i> Accesibilidad técnica</h4>
      <p>Contraste AA, fuentes legibles, alt en imágenes, subtítulos en video, navegación con teclado. Sin esto, excluyes a estudiantes.</p>
    </div>
    <div class="tip-card" style="border-left-color:#dc2626;">
      <h4><i class="fas fa-5"></i> Veracidad del contenido</h4>
      <p>La IA inventa datos. Verifica fechas, autores, cifras, citas. Si el recurso tiene un dato falso, tu credibilidad docente se cae.</p>
    </div>
    <div class="tip-card" style="border-left-color:#0284c7;">
      <h4><i class="fas fa-6"></i> Factibilidad real</h4>
      <p>¿Tus estudiantes tienen el dispositivo, internet, tiempo y conocimientos previos para usarlo? Si no, ajusta o cambia de recurso.</p>
    </div>
  </div>
</section>


<section class="component-group" id="actividades">

  <p class="desc">
    <i class="fas fa-puzzle-piece"></i> Aquí comparamos las 6 plataformas más usadas para actividades interactivas. Cada una tiene su superpoder específico: Mentimeter para encuestas en tiempo real, Kahoot para competencia energética, Quizizz para asíncrono con humor, Wordwall para arrastrar y completar, Educaplay para variedad de mecánicas, Curipod para lecciones completas con IA integrada. No escojas "la mejor": usa la que mejor encaje con el momento pedagógico. Un Kahoot para activar energías al inicio, un Mentimeter para sondear preconcepciones, un Wordwall para práctica con feedback.
  </p>

    <table class="data-table">

<section class="component-group" id="evaluacion">
  <h2>📝 Rúbricas y Evaluación con IA <span class="badge">De hours a minutes</span></h2>
  <p class="desc">
    <i class="fas fa-clipboard-check"></i> La evaluación es donde la IA más acelera tu trabajo. Una rúbrica analítica de 5 criterios × 4 niveles que tradicionalmente tomaba 2 horas, ahora toma 20 minutos: la IA genera el primer borrador, tú lo refinas. Pero cuidado: la IA también puede darte rúbricas vagas ("buen manejo del tema") que no sirven para evaluar. El truco es pedir <strong>descriptores observables</strong>, no juicios. Aquí tienes los tipos de rúbrica, las plantillas y los prompts que funcionan.
  </p>

  <h3 class="sub-title"><i class="fas fa-1"></i> Tipos de rúbrica (cuándo usar cada una)</h3>
  <div class="tips-grid">
    <div class="tip-card" style="border-left-color:#c2410c;">
      <h4><i class="fas fa-th-list"></i> Analítica</h4>
      <p>Cada criterio se evalúa por separado en niveles. Mejor para feedback detallado. Más trabajo de diseño pero más justo. <strong>Recomendada default</strong>.</p>
    </div>
    <div class="tip-card" style="border-left-color:#7c3aed;">
      <h4><i class="fas fa-th-large"></i> Holística</h4>
      <p>Una sola valoración global del producto. Más rápida, menos feedback. Útil para tareas cortas o de respuesta única.</p>
    </div>
    <div class="tip-card" style="border-left-color:#16a34a;">
      <h4><i class="fas fa-1"></i> De punto único</h4>
      <p>Solo se describe el nivel "logrado"; lo demás se infiere. Útil para autoevaluación rápida del estudiante.</p>
    </div>
    <div class="tip-card" style="border-left-color:#d97706;">
      <h4><i class="fas fa-arrows-rotate"></i> De desarrollo</h4>
      <p>Se actualiza durante el proyecto. Útil para proyectos largos con iteraciones (PBL, portafolios).</p>
    </div>
  </div>

  <h3 class="sub-title"><i class="fas fa-2"></i> Estructura de una buena rúbrica analítica</h3>
  <div style="overflow-x:auto;">
    <table class="data-table">
      <thead><tr><th>Criterio</th><th>Peso</th><th>Inicial (1)</th><th>En desarrollo (2)</th><th>Logrado (3)</th><th>Sobresaliente (4)</th></tr></thead>
      <tbody>
        <tr><td><strong>Tesis</strong></td><td>25%</td><td>No presenta tesis o es vaga</td><td>Tesis presente pero débil o ambigua</td><td>Tesis clara, específica, defendible</td><td>Tesis original, matizada, con alcance argumental completo</td></tr>
        <tr><td><strong>Evidencias</strong></td><td>30%</td><td>Sin evidencias o no relevantes</td><td>1-2 evidencias básicas</td><td>3+ evidencias relevantes y citadas</td><td>Evidencias diversas, contrainterpretadas, citadas en APA</td></tr>
        <tr><td><strong>Estructura</strong></td><td>15%</td><td>Sin organización clara</td><td>Organización básica</td><td>Introducción, desarrollo, cierre coherentes</td><td>Estructura argumentativa sofisticada, transiciones efectivas</td></tr>
        <tr><td><strong>Contraargumentación</strong></td><td>20%</td><td>No aborda objeciones</td><td>Menciona objeciones superficiales</td><td>Reconoce y responde 2+ objeciones</td><td>Anticipa y rebate objeciones de manera sofisticada</td></tr>
        <tr><td><strong>Registro académico</strong></td><td>10%</td><td>Lenguaje coloquial, errores frecuentes</td><td>Registro mixto, algunos errores</td><td>Registro académico apropiado, errores mínimos</td><td>Registro académico sofisticado, sintaxis variada</td></tr>
      </tbody>
    </table>
  </div>

  <h3 class="sub-title"><i class="fas fa-3"></i> Prompts para generar rúbricas (copy-paste)</h3>
  <div class="prompt-block">
    <span class="prompt-tag">Rúbrica analítica completa</span><br>
    "Diseña una rúbrica analítica con 4 niveles (Inicial, En desarrollo, Logrado, Sobresaliente) y <code>5</code> criterios para evaluar <code>TIPO_DE_PRODUCTO</code> de <code>NIVEL</code>. Criterios sugeridos: <code>LISTA</code>. Pesos: <code>DISTRIBUCIÓN</code>. Para cada celda, escribe un descriptor <strong>observable</strong> (qué se ve en el producto), no un juicio vago (bueno/malo). Formato tabla markdown. Incluye 1 ejemplo de descriptor 'Sobresaliente' comentado al final."
  </div>

  <div class="prompt-block">
    <span class="prompt-tag">Convertir evaluación sumativa en formativa</span><br>
    "Tengo este examen sumativo de <code>MATERIA</code> para <code>GRADO</code>: <code>PEGAR_EXAMEN</code>. Convértelo en 3 instrumentos de evaluación formativa distintos: 1) ticket de salida (5 min), 2) autoevaluación guiada, 3) retroalimentación entre pares con plantilla. Mantiene el mismo objetivo pero cambia el momento y la función."
  </div>

  <div class="prompt-block">
    <span class="prompt-tag">Generar retroalimentación personalizada</span><br>
    "Aquí tienes un trabajo de estudiante: <code>PEGAR</code>. Y la rúbrica: <code>PEGAR_RÚBRICA</code>. Genera retroalimentación específica en 3 párrafos: 1) qué hizo bien (con ejemplos), 2) qué mejorar (con sugerencias concretas), 3) siguiente paso de aprendizaje. Tono cercano, no punitivo. Máx 250 palabras."
  </div>

  <div class="alert-box alert-warn"><i class="fas fa-triangle-exclamation"></i><div><strong>Precaución ética:</strong> al subir trabajos de estudiantes a la IA, anonimiza primero (quita nombres, IDs). Verifica las políticas de privacidad de tu institución. La sección <strong>Ética</strong> profundiza.</div></div>
</section>


<section class="component-group" id="video">
  <h2>🎬 Video y Video-lecciones <span class="badge">Flipped classroom</span></h2>
  <p class="desc">
    <i class="fas fa-video"></i> El video desbloquea el modelo flipped classroom: el estudiante ve el contenido antes de clase y el tiempo presencial se usa para aplicación. Hoy, con IA, no necesitas cámara ni micrófono: Synthesia y HeyGen generan avatares que hablan tu guion, Loom graba tu pantalla, CapCut edita con IA. Una video-lección de 3 minutos se produce en una hora, no en un día. Aquí están las plataformas y los prompts que mejor funcionan.
  </p>

  <div class="ecosystem-grid">
    <div class="eco-card">
      <i class="fas fa-user-astronaut icon-big" style="color:#7c3aed;"></i>
      <h3>Synthesia <span class="tag">Avatares IA</span></h3>
      <p>Genera videos con avatares realistas que hablan tu guion en 140+ idiomas. Excelente para videos institucionales, tutoriales multilingües, lecciones sin exponerte físicamente.</p>
      <p class="use-case"><i class="fas fa-check"></i> Cuando no tienes tiempo/cámara o necesitas versiones en varios idiomas.</p>
    </div>
    <div class="eco-card">
      <i class="fas fa-headphones-simple icon-big" style="color:#16a34a;"></i>
      <h3>HeyGen <span class="tag">Tu clon digital</span></h3>
      <p>Similar a Synthesia, con énfasis en "clones" personalizados a partir de un video tuyo de 2 min. Resultado muy personal si lo usas bien.</p>
      <p class="use-case"><i class="fas fa-check"></i> Cuando quieres que el video sea tuyo, pero no grabar cada vez.</p>
    </div>
    <div class="eco-card">
      <i class="fas fa-camera icon-big" style="color:#c2410c;"></i>
      <h3>Loom <span class="tag">Pantalla + cara</span></h3>
      <p>Graba tu pantalla con tu cara en burbuja. Ideal para tutoriales, feedback a estudiantes, explicaciones paso a paso. Gratis hasta 25 videos.</p>
      <p class="use-case"><i class="fas fa-check"></i> Para feedback personalizado, demostraciones, instrucciones técnicas.</p>
    </div>
    <div class="eco-card">
      <i class="fas fa-scissors icon-big" style="color:#dc2626;"></i>
      <h3>CapCut <span class="tag">Edición con IA</span></h3>
      <p>Edición de video con IA: cortes automáticos, subtítulos generados, transiciones sugeridas. Versión web y mobile. Gratis (con marca de agua).</p>
      <p class="use-case"><i class="fas fa-check"></i> Para editar tus grabaciones de clase o videos para el aula.</p>
    </div>
    <div class="eco-card">
      <i class="fas fa-magnifying-glass icon-big" style="color:#d97706;"></i>
      <h3>Screencastify <span class="tag">Extensión Chrome</span></h3>
      <p>Graba pantalla desde el navegador. Integra con Google Classroom. Bueno si usas Chrome y Workspace.</p>
      <p class="use-case"><i class="fas fa-check"></i> Cuando ya vives en Google Workspace.</p>

      <h3>Adobe Express Video <span class="tag">Plantillas</span></h3>
      <p>Genera videos cortos con plantillas profesionales, animaciones y textos. Útil para introducciones, promocionales, videos cortos.</p>
      <p class="use-case"><i class="fas fa-check"></i> Para videos promocionales del curso o teasers.</p>
    </div>
  </div>

  <h3 class="sub-title"><i class="fas fa-scroll"></i> Estructura de un buen guion de video-lección</h3>
  <p style="color:var(--text-soft); font-size:0.95rem; line-height:1.7; margin-bottom:16px;">
    Un video-lección no es una clase grabada de 50 minutos. Es un micro-contenido de 3-7 minutos, focado en un objetivo. Sigue la estructura <strong>Hook · Desarrollo · Mini-reto</strong>: empieza con algo que enganche (un problema cotidiano, una pregunta provocadora), desarrolla el contenido (máx 3 ideas clave), y cierra con un mini-reto para que el estudiante llegue a clase con algo que intentar.
  </p>

  <div class="prompt-block">
    <span class="prompt-tag">Prompt · Guion de video-lección</span><br>
    "Escribe el guion de un video-lección de <code>3 minutos</code> sobre <code>TEMA</code> para <code>GRADO</code>. Estructura: 1) Hook (15 seg, problema cotidiano), 2) Desarrollo (2 min, 3 ideas clave con 1 ejemplo cada una), 3) Mini-reto (45 seg, reta al estudiante a intentar X antes de clase). Indica en cada segmento: locución (lo que se dice) y visuals (lo que se ve). Sin texto largo en pantalla."
  </div>

  <div class="alert-box alert-info"><i class="fas fa-circle-info"></i><div><strong>Tip DUA:</strong> siempre que hagas un video-lección, genera subtítulos y transcripción. DUA: representación múltiple del contenido. La mayoría de plataformas (Synthesia, HeyGen, CapCut) lo hacen automático.</div></div>
</section>


<section class="component-group" id="codigo">
  <h2>💻 HTML/CSS/JS Básico para Personalizar <span class="badge">Solo lo necesario</span></h2>
  <p class="desc">
    <i class="fas fa-code"></i> No vas a ser desarrolladora web. Pero sí vas a encontrar plantillas (en H5P, Genially, ExeLearning) donde necesitas tocar un poquito de HTML/CSS para personalizar colores, tamaños o disposición. Y en algún momento querrás crear una actividad interactiva simple (un mini-quiz, un botón que responda) que no merece una plataforma entera. Aquí cubrimos el 20% del código que te resuelve el 80% de las personalizaciones. Puedes pedirle a la IA que escriba este código por ti; entenderlo te ayuda a saber qué pedirle y cómo evaluar lo que te da.
  </p>

  <h3 class="sub-title"><i class="fas fa-1"></i> HTML: estructura mínima</h3>
  <p style="color:var(--text-soft); font-size:0.95rem; line-height:1.7; margin-bottom:14px;">
    HTML define la <strong>estructura</strong>: títulos, párrafos, imágenes, botones. Es como el esqueleto de una página. Las etiquetas vienen en pares: <code>&lt;p&gt;...&lt;/p&gt;</code> para párrafo, <code>&lt;h1&gt;...&lt;/h1&gt;</code> para título principal, <code>&lt;img&gt;</code> para imagen (esta se cierra sola). Todo recurso web empieza con esta base.
  </p>
  <div class="prompt-block">
    <span class="prompt-tag">Estructura HTML básica</span><br>
    <code>&lt;!DOCTYPE html&gt;</code><br>
    <code>&lt;html lang="es"&gt;</code><br>
    <code>&nbsp;&nbsp;&lt;head&gt;</code> · metadatos, título, enlaces a CSS<br>
    <code>&nbsp;&nbsp;&lt;body&gt;</code> · lo que se ve<br>
    <code>&nbsp;&nbsp;&nbsp;&nbsp;&lt;h1&gt;Título&lt;/h1&gt;</code> · títulos<br>
    <code>&nbsp;&nbsp;&nbsp;&nbsp;&lt;p&gt;Párrafo&lt;/p&gt;</code> · texto<br>
    <code>&nbsp;&nbsp;&nbsp;&nbsp;&lt;img src="foto.jpg" alt="descripción"&gt;</code> · imagen (con alt para accesibilidad)<br>
    <code>&nbsp;&nbsp;&nbsp;&nbsp;&lt;button&gt;Clic&lt;/button&gt;</code> · botón<br>
    <code>&nbsp;&nbsp;&lt;/body&gt;</code><br>
    <code>&lt;/html&gt;</code>
  </div>

  <h3 class="sub-title"><i class="fas fa-2"></i> CSS: colores y tamaños</h3>
  <p style="color:var(--text-soft); font-size:0.95rem; line-height:1.7; margin-bottom:14px;">
    CSS define el <strong>estilo</strong>: colores, tamaños, márgenes, fuentes. Si HTML es el esqueleto, CSS es la ropa. Lo puedes incrustar dentro de HTML con la etiqueta <code>&lt;style&gt;...&lt;/style&gt;</code>. Las propiedades más útiles para personalizar un recurso didáctico: <code>color</code> (color del texto), <code>background</code> (color de fondo), <code>font-size</code> (tamaño de letra), <code>padding</code> (espaciado interno), <code>border-radius</code> (esquinas redondeadas), <code>font-family</code> (tipo de letra).
  </p>
  <div class="prompt-block">
    <span class="prompt-tag">CSS básico para personalizar un recurso</span><br>
    <code>body { font-family: 'Segoe UI', sans-serif; background: #faf7f2; color: #2a2218; }</code> — fondo y texto base<br>
    <code>h1 { color: #c2410c; font-size: 2rem; text-align: center; }</code> — título principal<br>
    <code>.tarjeta { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }</code> — una tarjeta<br>
    <code>button { background: #c2410c; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; }</code> — un botón<br>
    <code>button:hover { background: #9a3412; }</code> — efecto al pasar el mouse
  </div>

  <h3 class="sub-title"><i class="fas fa-3"></i> JS: interactividad mínima</h3>
  <p style="color:var(--text-soft); font-size:0.95rem; line-height:1.7; margin-bottom:14px;">
    JavaScript (JS) añade <strong>comportamiento</strong>: que un botón responda al clic, que aparezca un mensaje, que se valide un formulario. Para recursos didácticos simples, no necesitas frameworks. JS básico te da: mostrar/ocultar elementos, validar respuestas, contar intentos, dar feedback. Se incrusta con <code>&lt;script&gt;...&lt;/script&gt;</code>.
  </p>
  <div class="prompt-block">
    <span class="prompt-tag">JS básico: botón que muestra feedback</span><br>
    <code>&lt;button onclick="revisar()"&gt;Comprobar&lt;/button&gt;</code><br>
    <code>&lt;div id="feedback" style="display:none;"&gt;¡Correcto!&lt;/div&gt;</code><br>
    <code>&lt;script&gt;</code><br>
    <code>function revisar() {</code><br>
    <code>&nbsp;&nbsp;document.getElementById('feedback').style.display = 'block';</code><br>
    <code>}</code><br>
    <code>&lt;/script&gt;</code>
  </div>

  <h3 class="sub-title"><i class="fas fa-4"></i> Plantilla de quiz simple en HTML/CSS/JS (copia y pega)</h3>
  <div class="prompt-block">
    <span class="prompt-tag">Quiz de opción múltiple</span><br>
    "Genera un archivo HTML autocontenido (un solo archivo, sin dependencias externas) con un quiz de <code>N</code> preguntas de opción múltiple sobre <code>TEMA</code> para <code>GRADO</code>. Cada pregunta tiene 4 opciones y feedback inmediato al seleccionar. Al final, muestra puntuación total y cuáles falló. Diseño limpio, accesible, en español. Comentario en cada parte del código explicando qué hace."
  </div>
  <div class="alert-box alert-success"><i class="fas fa-circle-check"></i><div><strong>Lo que vas a poder hacer:</strong> crear cuadernos digitales interactivos, mini-quizzes sin plataforma, líneas de tiempo, infografías con datos dinámicos. La IA te da el código; tú lo guardas como <code>.html</code>, lo abres en el navegador y lo subes a tu LMS como archivo adjunto o link.</div></div>

  <h3 class="sub-title"><i class="fas fa-5"></i> CDN útiles para mejorar tus recursos HTML</h3>
  <div style="overflow-x:auto;">
    <table class="paqueteria-table">
      <thead><tr><th>Librería</th><th>CDN</th><th>Para qué</th></tr></thead>
      <tbody>
        <tr><td><strong>Bootstrap 5</strong></td><td><code class="cdn-code">&lt;link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"&gt;</code></td><td>Componentes y grid listos</td></tr>
        <tr><td><strong>Font Awesome</strong></td><td><code class="cdn-code">&lt;link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"&gt;</code></td><td>Iconos</td></tr>
        <tr><td><strong>Tailwind CSS</strong></td><td><code class="cdn-code">&lt;script src="https://cdn.tailwindcss.com"&gt;&lt;/script&gt;</code></td><td>Estilos utility-first</td></tr>
        <tr><td><strong>PicoCSS</strong></td><td><code class="cdn-code">&lt;link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"&gt;</code></td><td>CSS minimalista sin clases</td></tr>

<section class="component-group" id="lms">
  <h2>🏫 LMS: Dónde Vive tu Recurso <span class="badge">Moodle · Classroom · Canvas · Teams</span></h2>
  <p class="desc">
    <i class="fas fa-chalkboard"></i> Tu recurso no existe si solo está en tu computadora. Necesitas publicarlo donde tus estudiantes lo encuentren. Aquí están las 4 plataformas LMS (Learning Management System) más usadas en LATAM, con sus pros, contras y cómo subir cada tipo de recurso. No escojas la plataforma: tu institución ya lo hizo. Tu tarea es usar la que tienes <strong>en su máximo potencial</strong>.
  </p>

  <div class="ecosystem-grid">
    <div class="eco-card">
      <i class="fab fa-moodle icon-big" style="color:#f98012;"></i>
      <h3>Moodle <span class="tag">Open source</span></h3>
      <p>El más usado en universidades públicas de LATAM. Robusto, configurable, gratis para instalar. Curva alta pero potencia enorme. Soporta H5P, SCORM, plugins.</p>
      <p class="use-case"><i class="fas fa-check"></i> Si tu institución lo usa (universidad pública typical), aprende H5P + SCORM. Tu máximo aliado.</p>
    </div>
    <div class="eco-card">
      <i class="fab fa-google icon-big" style="color:#4285f4;"></i>
      <h3>Google Classroom <span class="tag">Simple y gratuito</span></h3>
      <p>El más accesible. Cualquier escuela con Gmail puede abrir uno. Curva mínima. Integración con Drive, Docs, Forms. Limitado en personalización.</p>
      <p class="use-case"><i class="fas fa-check"></i> Si tu escuela no tiene LMS oficial. Funciona para todo: subir PDF, crear tarea, hacer form, compartir link.</p>
    </div>
    <div class="eco-card">
      <i class="fas fa-chalkboard-user icon-big" style="color:#0077b6;"></i>
      <h3>Canvas (Instructure) <span class="tag">Universidades privadas</span></h3>
      <p>El LMS favorito de universidades privadas. Interfaz moderna, integraciones ricas. Soporta H5P, SCORM, LTI. Plan gratuito para docentes: Free for Teacher.</p>
      <p class="use-case"><i class="fas fa-check"></i> Si tu institución privada lo usa. Aprovecha las integraciones LTI para traer herramientas externas.</p>
    </div>
    <div class="eco-card">
      <i class="fab fa-microsoft icon-big" style="color:#0078d4;"></i>
      <h3>Microsoft Teams for Education <span class="tag">Clases + Office</span></h3>
      <p>El ecosistema de Microsoft 365. Combina videoconferencias, tareas, cuadernos de OneNote, archivos. Si tu escuela ya usa Office, Teams es natural.</p>
      <p class="use-case"><i class="fas fa-check"></i> Si tu institución tiene licencia Microsoft 365 Education. Aprovecha OneNote Class Notebook para portafolios.</p>
    </div>
  </div>

  <h3 class="sub-title"><i class="fas fa-table"></i> Cómo subir cada tipo de recurso a cada LMS</h3>

    <table class="data-table">

      <tbody>

        <tr><td><strong>Infografía (Canva)</strong></td><td>Embed HTML (link de Canva)</td><td>Material → Link</td><td>Módulo → URL externa</td><td>Pestaña → Link</td></tr>
        <tr><td><strong>Presentación (Genially)</strong></td><td>Embed (HTML iframe)</td><td>Material → Link</td><td>Módulo → URL</td><td>Pestaña → Link</td></tr>

      </tbody>
